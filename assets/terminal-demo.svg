<rect x="0.5" y="0.5" width="819" height="263" rx="10" fill="#191c22" stroke="#34434f"/>
<path d="M0.5 42V10.5a10 10 0 0 1 10-10h799a10 10 0 0 1 10 10V42z" fill="#1d1e23"/>

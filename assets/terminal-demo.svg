<circle cx="20" cy="21" r="4.5" fill="#34434f"/><circle cx="35" cy="21" r="4.5" fill="#34434f"/><circle cx="50" cy="21" r="4.5" fill="#34434f"/>
<rect class="tab t0" x="70" y="11" width="112" height="20" rx="5"/>
<text class="tabtext" x="126" y="25" text-anchor="middle">Contradiction</text>
<rect class="tab t1" x="186" y="11" width="155" height="20" rx="5"/>
<text class="tabtext" x="263.5" y="25" text-anchor="middle">Impossible scenario</text>
<rect class="tab t2" x="345" y="11" width="112" height="20" rx="5"/>
<text class="tabtext" x="401" y="25" text-anchor="middle">Missing proof</text>
<rect class="tab t3" x="461" y="11" width="112" height="20" rx="5"/>
<text class="tabtext" x="517" y="25" text-anchor="middle">Untraced code</text>
<rect class="tab t4" x="577" y="11" width="90" height="20" rx="5"/>
<text class="tabtext" x="622" y="25" text-anchor="middle">Ask the KB</text>
<rect class="tab t5" x="671" y="11" width="104" height="20" rx="5"/>
<text class="tabtext" x="723" y="25" text-anchor="middle">Context hook</text>
<text class="ln s0" style="animation-name:l0_0" x="18" y="74" xml:space="preserve"><tspan fill="#a2d3f4">› Sessions must expire after 30 minutes idle.</tspan></text>
<text class="ln s0" style="animation-name:l0_1" x="18" y="95" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kb_upsert</tspan><tspan fill="#aab8c2"> REQ-session-idle-timeout</tspan><tspan fill="#aab8c2">  </tspan><tspan fill="#a2d3f4">✓ saved</tspan></text>
<text class="ln s0" style="animation-name:l0_2" x="18" y="116" xml:space="preserve"><tspan fill="#a2d3f4">› Remember me keeps users signed in for 30 days.</tspan></text>
<text class="ln s0" style="animation-name:l0_3" x="18" y="137" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kb_upsert</tspan><tspan fill="#aab8c2"> REQ-session-remember-me</tspan><tspan fill="#aab8c2">  </tspan><tspan fill="#f07178">✗ refused</tspan></text>
<text class="ln s0" style="animation-name:l0_4" x="18" y="158" xml:space="preserve"><tspan fill="#f07178">  Contradicts REQ-session-idle-timeout</tspan></text>
<text class="ln s0" style="animation-name:l0_5" x="18" y="179" xml:space="preserve"><tspan fill="#f07178">  session idle timeout: ≤ 30 min vs ≥ 30 days</tspan></text>
<text class="ln s0" style="animation-name:l0_6" x="18" y="200" xml:space="preserve"><tspan fill="#aab8c2">  Nothing was written. A person decides which rule wins.</tspan></text>
<text class="ln s1" style="animation-name:l1_0" x="18" y="74" xml:space="preserve"><tspan fill="#a2d3f4">› Uploads are capped at 10 MB.</tspan></text>
<text class="ln s1" style="animation-name:l1_1" x="18" y="95" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kb_upsert</tspan><tspan fill="#aab8c2"> REQ-upload-size-limit</tspan><tspan fill="#aab8c2">  </tspan><tspan fill="#a2d3f4">✓ saved</tspan></text>
<text class="ln s1" style="animation-name:l1_2" x="18" y="116" xml:space="preserve"><tspan fill="#a2d3f4">› Users can upload a 25 MB video.</tspan></text>
<text class="ln s1" style="animation-name:l1_3" x="18" y="137" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kb_upsert</tspan><tspan fill="#aab8c2"> SCEN-upload-video</tspan><tspan fill="#aab8c2">  </tspan><tspan fill="#a2d3f4">✓ saved</tspan></text>
<text class="ln s1" style="animation-name:l1_4" x="18" y="158" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kb_check</tspan></text>
<text class="ln s1" style="animation-name:l1_5" x="18" y="179" xml:space="preserve"><tspan fill="#f07178">  ✗ SCEN-upload-video can never succeed:</tspan></text>
<text class="ln s1" style="animation-name:l1_6" x="18" y="200" xml:space="preserve"><tspan fill="#f07178">    it uploads 25 MB, REQ-upload-size-limit allows ≤ 10 MB</tspan></text>
<text class="ln s2" style="animation-name:l2_0" x="18" y="74" xml:space="preserve"><tspan fill="#a2d3f4">› Enforce the upload limit.</tspan></text>
<text class="ln s2" style="animation-name:l2_1" x="18" y="95" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">edit</tspan><tspan fill="#aab8c2"> src/upload.ts  validateUpload()</tspan></text>
<text class="ln s2" style="animation-name:l2_2" x="18" y="116" xml:space="preserve"><tspan fill="#aab8c2">  agent: Done. TEST-upload-photo is passing.</tspan></text>
<text class="ln s2" style="animation-name:l2_3" x="18" y="137" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kb_check</tspan></text>
<text class="ln s2" style="animation-name:l2_4" x="18" y="158" xml:space="preserve"><tspan fill="#f2b84b">  ! REQ-upload-size-limit is unproven:</tspan></text>
<text class="ln s2" style="animation-name:l2_5" x="18" y="179" xml:space="preserve"><tspan fill="#f2b84b">    &quot;passing&quot; is a claim; no test run backs it for this commit</tspan></text>
<text class="ln s2" style="animation-name:l2_6" x="18" y="200" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kibi prove</tspan><tspan fill="#aab8c2"> --test TEST-upload-photo</tspan></text>
<text class="ln s2" style="animation-name:l2_7" x="18" y="221" xml:space="preserve"><tspan fill="#63c99a">  ✓ REQ-upload-size-limit proven at this commit</tspan></text>
<text class="ln s3" style="animation-name:l3_0" x="18" y="74" xml:space="preserve"><tspan fill="#a2d3f4">› Also resize photos before upload.</tspan></text>
<text class="ln s3" style="animation-name:l3_1" x="18" y="95" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">edit</tspan><tspan fill="#aab8c2"> src/resize.ts  resizeImage()</tspan></text>
<text class="ln s3" style="animation-name:l3_2" x="18" y="116" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">git commit</tspan></text>
<text class="ln s3" style="animation-name:l3_3" x="18" y="137" xml:space="preserve"><tspan fill="#aab8c2">  pre-commit: kibi check --staged</tspan></text>
<text class="ln s3" style="animation-name:l3_4" x="18" y="158" xml:space="preserve"><tspan fill="#f07178">  ✗ resizeImage implements no requirement</tspan></text>
<text class="ln s3" style="animation-name:l3_5" x="18" y="179" xml:space="preserve"><tspan fill="#f07178">  Commit blocked.</tspan></text>
<text class="ln s3" style="animation-name:l3_6" x="18" y="200" xml:space="preserve"><tspan fill="#aab8c2">  The agent asks you why it exists, then links it.</tspan></text>
<text class="ln s4" style="animation-name:l4_0" x="18" y="74" xml:space="preserve"><tspan fill="#a2d3f4">› How big can uploads be? Check before you change anything.</tspan></text>
<text class="ln s4" style="animation-name:l4_1" x="18" y="95" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">kb_search</tspan><tspan fill="#aab8c2"> &quot;upload size limit&quot;</tspan></text>
<text class="ln s4" style="animation-name:l4_2" x="18" y="116" xml:space="preserve"><tspan fill="#a2d3f4">  REQ-upload-size-limit  Uploaded files must be at most 10 MB</tspan></text>
<text class="ln s4" style="animation-name:l4_3" x="18" y="137" xml:space="preserve"><tspan fill="#aab8c2">    must stay true: upload file size ≤ 10 MB</tspan></text>
<text class="ln s4" style="animation-name:l4_4" x="18" y="158" xml:space="preserve"><tspan fill="#aab8c2">    implemented by: validateUpload  src/upload.ts</tspan></text>
<text class="ln s4" style="animation-name:l4_5" x="18" y="179" xml:space="preserve"><tspan fill="#aab8c2">    verified by: TEST-upload-photo</tspan></text>
<text class="ln s4" style="animation-name:l4_6" x="18" y="200" xml:space="preserve"><tspan fill="#aab8c2">  agent: The cap is 10 MB, and it's a requirement, not a guess.</tspan></text>
<text class="ln s5" style="animation-name:l5_0" x="18" y="74" xml:space="preserve"><tspan fill="#a2d3f4">› Users keep getting logged out. Make sessions last longer.</tspan></text>
<text class="ln s5" style="animation-name:l5_1" x="18" y="95" xml:space="preserve"><tspan fill="#aab8c2">  </tspan><tspan fill="#3e8ed6" font-weight="600">edit</tspan><tspan fill="#aab8c2"> src/session.ts  refreshSession()</tspan></text>
<text class="ln s5" style="animation-name:l5_2" x="18" y="116" xml:space="preserve"><tspan fill="#a2d3f4">  ↳ Kibi: this edit is inside refreshSession,</tspan></text>
<text class="ln s5" style="animation-name:l5_3" x="18" y="137" xml:space="preserve"><tspan fill="#a2d3f4">    which implements REQ-session-idle-timeout</tspan></text>
<text class="ln s5" style="animation-name:l5_4" x="18" y="158" xml:space="preserve"><tspan fill="#a2d3f4">    must keep true: idle timeout ≤ 30 min</tspan></text>
<text class="ln s5" style="animation-name:l5_5" x="18" y="179" xml:space="preserve"><tspan fill="#a2d3f4">    covered by TEST-session-idle-expiry</tspan></text>
<text class="ln s5" style="animation-name:l5_6" x="18" y="200" xml:space="preserve"><tspan fill="#aab8c2">  agent: That would break a security rule (≤ 30 min idle).</tspan></text>
<text class="ln s5" style="animation-name:l5_7" x="18" y="221" xml:space="preserve"><tspan fill="#aab8c2">         Replace the rule, or add &quot;remember me&quot; instead?</tspan></text>
</svg>

name: SWI-Prolog bundle spike

on:
  push:
    branches: [codex/swipl-bundle-spike]
    paths:
      - .github/workflows/swipl-spike.yml
      - scripts/swipl-spike.py
      - scripts/swipl-spike.sh
      - scripts/swipl-version.json
      - packages/core/src/**
      - packages/core/tests/**
      - packages/cli/src/**
      - packages/cli/tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Install native build and audit tools
        run: |
          dnf install -y perl-core make gcc gcc-c++ binutils file
          /opt/python/cp311-cp311/bin/python -m pip install --no-cache-dir cmake==3.31.10 ninja==1.13.0 patchelf==0.17.2.4
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify no system SWI-Prolog and install JS dependencies
        run: |
          if command -v swipl; then
            echo 'Expected no preinstalled swipl in manylinux container' >&2
            exit 1
          fi
          bun install --frozen-lockfile
      - name: Build, relocate, audit, and run Prolog and CLI suites
        run: |
          export PATH="/opt/python/cp311-cp311/bin:$PATH"
          bash scripts/swipl-spike.sh build-and-test --target linux-x64-gnu --workdir "$RUNNER_TEMP/swipl-spike"
      - name: Show measurements and test results
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/swipl-spike/report.json" ]; then
            cat "$RUNNER_TEMP/swipl-spike/report.json"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-spike-linux-x64
          path: |
            ${{ runner.temp }}/swipl-spike/report.json
            ${{ runner.temp }}/swipl-spike/swipl-relocated.tar.gz
          if-no-files-found: warn
          retention-days: 7

  darwin-arm64:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify native tools and no system SWI-Prolog
        run: |
          command -v cmake
          command -v make
          command -v install_name_tool
          command -v codesign
          command -v otool
          if command -v swipl; then
            echo 'Expected no preinstalled swipl on macOS runner' >&2
            exit 1
          fi
          bun install --frozen-lockfile
      - name: Build, relocate, audit, sign, and run Prolog and CLI suites
        run: bash scripts/swipl-spike.sh build-and-test --target darwin-arm64 --workdir "$RUNNER_TEMP/swipl-spike"
      - name: Show measurements and test results
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/swipl-spike/report.json" ]; then
            cat "$RUNNER_TEMP/swipl-spike/report.json"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-spike-darwin-arm64
          path: |
            ${{ runner.temp }}/swipl-spike/report.json
            ${{ runner.temp }}/swipl-spike/swipl-relocated.tar.gz
          if-no-files-found: warn
          retention-days: 7

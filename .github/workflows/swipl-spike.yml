name: SWI-Prolog bundle spike

on:
  push:
    branches: [codex/swipl-bundle-spike]
    paths:
      - .github/workflows/swipl-spike.yml
      - scripts/swipl-spike.py
      - scripts/swipl-spike.sh
      - scripts/swipl-version.json
      - scripts/skillopt-eval/adoption-lock.ts
      - scripts/skillopt-eval/adoption-durable.ts
      - scripts/skillopt-eval/tests/adoption-lock*.ts
      - scripts/sync-agent-skills.ts
      - scripts/tests/sync-agent-skills.test.ts
      - packages/core/src/**
      - packages/core/tests/**
      - packages/cli/src/**
      - packages/cli/tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Locate container work directory
        id: paths
        run: echo "dir=$RUNNER_TEMP/swipl-spike" >> "$GITHUB_OUTPUT"
      - name: Install native build and audit tools
        run: |
          dnf install -y perl-core make gcc gcc-c++ binutils file shadow-utils util-linux
          /opt/python/cp311-cp311/bin/python -m pip install --no-cache-dir cmake==3.31.10 ninja==1.13.0 patchelf==0.17.2.4
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify no system SWI-Prolog and install JS dependencies
        run: |
          if command -v swipl; then
            echo 'Expected no preinstalled swipl in manylinux container' >&2
            exit 1
          fi
          bun install --frozen-lockfile
      - name: Build, relocate, audit, and run Prolog and CLI suites
        shell: bash
        env:
          SPIKE_DIR: ${{ steps.paths.outputs.dir }}
        run: |
          set -euo pipefail
          useradd --user-group --create-home --shell /bin/bash kibi-spike
          test "$(id -u kibi-spike)" -ne 0
          install -d -m 755 "$SPIKE_DIR/tools/bin"
          install -m 755 "$(command -v bun)" "$SPIKE_DIR/tools/bin/bun"
          chown -R kibi-spike:kibi-spike "$GITHUB_WORKSPACE" "$SPIKE_DIR"
          spike_path="$SPIKE_DIR/tools/bin:/opt/python/cp311-cp311/bin:$PATH"
          runuser -u kibi-spike -- env \
            HOME=/home/kibi-spike \
            BUN_INSTALL=/home/kibi-spike/.bun \
            PATH="$spike_path" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            SPIKE_DIR="$SPIKE_DIR" \
            GITHUB_ACTIONS=true \
            bash -c '
              set -euo pipefail
              test "$(id -u)" -ne 0
              test "$(command -v bun)" = "$SPIKE_DIR/tools/bin/bun"
              for tool in node python3 cmake git; do command -v "$tool"; done
              test -w "$GITHUB_WORKSPACE" && test -w "$SPIKE_DIR"
              cd "$GITHUB_WORKSPACE"
              git rev-parse --is-inside-work-tree
              bun test --timeout 15000 --isolate --max-concurrency=1 \
                ./scripts/skillopt-eval/tests/adoption-lock.test.ts \
                ./scripts/skillopt-eval/tests/adoption-lock.contention.test.ts \
                ./scripts/skillopt-eval/tests/adoption-lock.remaining.coverage.test.ts \
                ./scripts/tests/sync-agent-skills.test.ts
              bash scripts/swipl-spike.sh build-and-test --target linux-x64-gnu --workdir "$SPIKE_DIR"
            '
      - name: Verify Linux deliverables
        if: success()
        env:
          SPIKE_DIR: ${{ steps.paths.outputs.dir }}
        run: |
          test -s "$SPIKE_DIR/report.json"
          test -s "$SPIKE_DIR/swipl-relocated.tar.gz"
      - name: Show measurements and test results
        if: always()
        env:
          SPIKE_DIR: ${{ steps.paths.outputs.dir }}
        run: |
          if [ -f "$SPIKE_DIR/report.json" ]; then
            cat "$SPIKE_DIR/report.json"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-spike-linux-x64
          path: |
            ${{ steps.paths.outputs.dir }}/report.json
            ${{ steps.paths.outputs.dir }}/swipl-relocated.tar.gz
          if-no-files-found: warn
          retention-days: 7

  darwin-arm64:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Locate runner work directory
        id: paths
        run: echo "dir=$RUNNER_TEMP/swipl-spike" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify native tools and no system SWI-Prolog
        run: |
          command -v cmake
          command -v make
          command -v install_name_tool
          command -v codesign
          command -v otool
          if command -v swipl; then
            echo 'Expected no preinstalled swipl on macOS runner' >&2
            exit 1
          fi
          bun install --frozen-lockfile
      - name: Verify native skill mirror locks before building
        run: |
          bun test --timeout 15000 --isolate --max-concurrency=1 \
            ./scripts/skillopt-eval/tests/adoption-lock.test.ts \
            ./scripts/skillopt-eval/tests/adoption-lock.contention.test.ts \
            ./scripts/skillopt-eval/tests/adoption-lock.remaining.coverage.test.ts \
            ./scripts/tests/sync-agent-skills.test.ts
      - name: Build, relocate, audit, sign, and run Prolog and CLI suites
        env:
          SPIKE_DIR: ${{ steps.paths.outputs.dir }}
        run: bash scripts/swipl-spike.sh build-and-test --target darwin-arm64 --workdir "$SPIKE_DIR"
      - name: Verify macOS deliverables
        if: success()
        env:
          SPIKE_DIR: ${{ steps.paths.outputs.dir }}
        run: |
          test -s "$SPIKE_DIR/report.json"
          test -s "$SPIKE_DIR/swipl-relocated.tar.gz"
      - name: Show measurements and test results
        if: always()
        env:
          SPIKE_DIR: ${{ steps.paths.outputs.dir }}
        run: |
          if [ -f "$SPIKE_DIR/report.json" ]; then
            cat "$SPIKE_DIR/report.json"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-spike-darwin-arm64
          path: |
            ${{ steps.paths.outputs.dir }}/report.json
            ${{ steps.paths.outputs.dir }}/swipl-relocated.tar.gz
          if-no-files-found: warn
          retention-days: 7

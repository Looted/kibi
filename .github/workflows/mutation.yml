name: Mutation

# Stryker mutation suite (see docs/mutation-testing.md). It runs nightly on
# develop and on pull requests that touch the mutated packages or the
# mutation setup, so unrelated PRs do not pay for it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Kibi's own CI never sends anonymous usage telemetry.
  KIBI_TELEMETRY: "0"

permissions:
  contents: read

on:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    branches: [develop]
    paths:
      - 'packages/runtime/src/**'
      - 'packages/runtime/tests/**'
      - 'packages/codex/src/**'
      - 'packages/codex/tests/**'
      - 'packages/cursor/src/**'

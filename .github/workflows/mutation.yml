name: Mutation

# Stryker mutation suite (see docs/mutation-testing.md). It runs nightly on
# develop and on pull requests that touch the mutated packages or the
# mutation setup, so unrelated PRs do not pay for it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    branches: [develop]
    paths:
      - 'packages/runtime/src/**'
      - 'packages/runtime/tests/**'
      - 'packages/codex/src/**'
      - 'packages/codex/tests/**'
      - 'packages/cursor/src/**'
      - 'packages/cursor/tests/**'
      - 'packages/agent-core/src/**'
      # kibi-cli modules in scope (CLI_MUTATION_MODULES in stryker.conf.mjs)
      - 'packages/cli/src/cli-input.ts'
      - 'packages/cli/tests/cli-input.test.ts'
      - 'stryker.conf.mjs'
      - 'scripts/mutation-sandbox-setup.sh'
      - '.github/workflows/mutation.yml'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      # The codex and cursor tests rebuild their package, which needs the
      # workspace dist outputs (kibi-agent-core, kibi-plugin-sdk, ...).
      - name: Build packages
        run: bun run build

      - name: Run mutation suite
        run: bun run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

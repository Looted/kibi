name: Publish to npm

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master]

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      release_action: ${{ steps.decide.outputs.action }}
      toPublish: ${{ steps.decide.outputs.toPublish }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Determine release action
        id: decide
        run: |
          DECISION=$(bun run scripts/run-release-state.ts)
          ACTION=$(echo "$DECISION" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.action)")
          TO_PUBLISH=$(echo "$DECISION" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));d.toPublish.forEach(x=>console.log(x))")
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "toPublish<<EOF" >> $GITHUB_OUTPUT
          echo "$TO_PUBLISH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Release action: $ACTION"
          echo "$DECISION"

  # The platform packages' SWI-Prolog binaries are built by this very run, from
  # this commit's pinned sources (scripts/swipl-version.json), and consumed by
  # build-and-check through same-run artifacts. Nothing is fetched from an
  # earlier run, so no retention window, run selection, or foreign artifact can
  # decide what ships; the populate step also refuses any archive whose
  # embedded commit and run id differ from this run's.
  swipl-build:
    needs: check-release
    if: ${{ needs.check-release.outputs.release_action != 'NOOP' && needs.check-release.outputs.release_action != 'ALREADY_PUBLISHED_NOOP' }}
    permissions:
      contents: read
    uses: ./.github/workflows/swipl-build.yml

  build-and-check:
    runs-on: ubuntu-latest
    needs: [check-release, swipl-build]
    if: ${{ needs.check-release.outputs.release_action != 'NOOP' && needs.check-release.outputs.release_action != 'ALREADY_PUBLISHED_NOOP' }}
    outputs:
      toPublish: ${{ steps.check-packages.outputs.toPublish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm auth and tooling
        run: |
          node --version
          npm --version
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      - name: Check Codex hook bundle drift
        run: bun run --filter kibi-codex check:hook-bundle

      - name: Typecheck matrix
        run: bun run typecheck
      - name: Verify generated schema parity
        run: bun run schema:check
      - name: Verify generated rule registry parity
        run: bun run rules:check
      - name: Verify generated symbol classification parity
        run: bun run symbols:check

      - name: Build packages
        run: bun run build
      - name: Build and package VS Code extension
        run: bun run --cwd packages/vscode package
      - name: Download SWI-Prolog pipeline archives
        uses: actions/download-artifact@v6
        with:
          pattern: swipl-*
          path: ${{ runner.temp }}/swipl-artifacts
      - name: Verify archives and populate the platform packages
        run: node scripts/populate-swipl-platform-packages.mjs --artifacts "$RUNNER_TEMP/swipl-artifacts"
      - name: Verify publish metadata for npm provenance
        run: bun run scripts/verify-publish-metadata.ts --require-swipl-payload
      - name: Clean stale tarballs
        run: bun run clean:tarballs
      - name: Pack packages
        run: bun run scripts/pack-packages.ts --slice publishable
      - name: Record tarball digests
        run: |
          cd packages
          sha256sum */*.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Typecheck and compile e2e tests
        run: bun run compile:e2e:packed
        env:
          KIBI_E2E_COMPILED_DIR: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Upload compiled e2e tests
        uses: actions/upload-artifact@v6
        with:
          name: release-e2e-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
          if-no-files-found: error
          retention-days: 1
      - name: Upload package tarballs
        uses: actions/upload-artifact@v6
        with:
          name: package-tarballs
          path: |
            packages/SHA256SUMS
            packages/core/*.tgz
            packages/plugin-sdk/*.tgz
            packages/agent-core/*.tgz
            packages/plugin-builtin/*.tgz
            packages/plugin-jev/*.tgz
            packages/swipl-linux-x64-gnu/*.tgz
            packages/swipl-linux-arm64-gnu/*.tgz
            packages/swipl-darwin-arm64/*.tgz
            packages/swipl-darwin-x64/*.tgz
            packages/swipl/*.tgz
            packages/runtime/*.tgz
            packages/cli/*.tgz
            packages/mcp/*.tgz
            packages/opencode/*.tgz
            packages/codex/*.tgz
            packages/cursor/*.tgz
          retention-days: 1
      - name: Upload VS Code extension VSIX
        uses: actions/upload-artifact@v6
        with:
          name: vscode-vsix
          path: packages/vscode/*.vsix
          retention-days: 1
      - name: Pass through packages to publish
        id: check-packages
        run: |
          cat >> $GITHUB_OUTPUT <<'EOFMARKER'
          toPublish<<EOF
          ${{ needs.check-release.outputs.toPublish }}
          EOF
          EOFMARKER

  release-gate:
    runs-on: ubuntu-latest
    needs: [build-and-check, check-release]
    if: ${{ always() && needs.build-and-check.result == 'success' && needs.build-and-check.outputs.toPublish != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download package tarballs
        uses: actions/download-artifact@v6
        with:
          name: package-tarballs
          path: packages
      - name: Build CLI workspace for packed typecheck
        run: bun run build:cli-stack
      - name: Tarball content verification
        run: |
          bun test --cwd documentation/tests/e2e/packed --timeout=300000 cli-verify-tarball-core.test.ts packed-path-hygiene.test.ts
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5
      - name: Isolated CLI and MCP package contract verification
        run: |
          corepack enable
          bun test --cwd documentation/tests/e2e/packed --timeout=300000 release-package-contract.test.ts
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10
      - name: Opencode packed behavior verification
        run: |
          bun run compile:e2e:packed
          export NODE_OPTIONS='--enable-source-maps' && bunx node --test --test-concurrency=1 "$RUNNER_TEMP/kibi-e2e-packed-compiled/opencode-install.test.js" "$RUNNER_TEMP/kibi-e2e-packed-compiled/opencode-plugin.test.js" "$RUNNER_TEMP/kibi-e2e-packed-compiled/opencode-bootstrap-paths.test.js"
        env:
          KIBI_E2E_COMPILED_DIR: ${{ runner.temp }}/kibi-e2e-packed-compiled
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10
      - name: Strict install smoke test
        run: |
          mkdir -p /tmp/kibi-smoke-test
          cd /tmp/kibi-smoke-test
          npm init -y
          npm install ${{ github.workspace }}/packages/core/kibi-core-*.tgz
          npm install ${{ github.workspace }}/packages/plugin-sdk/kibi-plugin-sdk-*.tgz
          npm install ${{ github.workspace }}/packages/agent-core/kibi-agent-core-*.tgz
          npm install ${{ github.workspace }}/packages/plugin-builtin/kibi-plugin-builtin-*.tgz
          npm install ${{ github.workspace }}/packages/swipl/kibi-swipl-*.tgz
          npm install ${{ github.workspace }}/packages/runtime/kibi-runtime-*.tgz
          npm install ${{ github.workspace }}/packages/cli/kibi-cli-*.tgz
          npm install ${{ github.workspace }}/packages/mcp/kibi-mcp-*.tgz
          npm install ${{ github.workspace }}/packages/opencode/kibi-opencode-*.tgz
          npm install ${{ github.workspace }}/packages/codex/kibi-codex-*.tgz
          # Assert optional Jev/TypeSafe stay out of the default tree.
          test ! -d ./node_modules/kibi-plugin-jev
          test ! -d ./node_modules/@typesafe-ai
          # /tmp/kibi-smoke-test is intentionally not a git repository;
          # standalone workspaces must declare their branch identity.
          export KIBI_BRANCH=smoke
          ./node_modules/.bin/kibi --version
          ./node_modules/.bin/kibi init --no-hooks
          ./node_modules/.bin/kibi query req
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
        timeout-minutes: 5
      - name: MCP server smoke test
        run: |
          cd /tmp/kibi-smoke-test
          timeout 10s ./node_modules/.bin/kibi-mcp < /dev/null || true
        timeout-minutes: 2

  # The packed tarballs, installed with npm on runners with no SWI-Prolog,
  # must run kibi init/sync/check, doctor, and an MCP round trip on the bundle.
  bundled-runtime-smoke:
    needs: [build-and-check, check-release]
    if: ${{ always() && needs.build-and-check.result == 'success' && needs.build-and-check.outputs.toPublish != '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      tarballs-artifact: package-tarballs
      e2e-artifact: release-e2e-compiled

  publish:
    runs-on: ubuntu-latest
    needs: [build-and-check, release-gate, bundled-runtime-smoke, check-release]
    if: ${{ needs.build-and-check.outputs.toPublish != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download package tarballs
        uses: actions/download-artifact@v6
        with:
          name: package-tarballs
          path: packages
      - name: Verify tarball digests and bundled binaries
        run: |
          set -euo pipefail
          (cd packages && sha256sum -c SHA256SUMS)
          for tarball in packages/swipl-*/*.tgz; do
            expected=$(tar -xzOf "$tarball" package/build-manifest.json | node -e '
              const m = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              if (m.binary?.path !== "bin/swipl" || !/^[0-9a-f]{64}$/.test(m.binary.sha256)) process.exit(1);
              process.stdout.write(m.binary.sha256);')
            actual=$(tar -xzOf "$tarball" package/bin/swipl | sha256sum | cut -d' ' -f1)
            if [ "$expected" != "$actual" ]; then
              echo "bin/swipl in $tarball does not match its manifest SHA-256"
              exit 1
            fi
            echo "verified $(basename "$tarball") binary $actual"
          done
      - name: Publish packages
        run: |
          to_publish="${{ needs.build-and-check.outputs.toPublish }}"
          while IFS= read -r output; do
            [ -z "$output" ] && continue
            pkg_dir="${output%=*}"
            pkg_name="${output#*=}"
            tarball=$(ls "${GITHUB_WORKSPACE}/packages/${pkg_dir}"/*.tgz 2>/dev/null | head -1)
            if [ -z "$tarball" ]; then
              echo "No tarball found for ${pkg_name} in packages/${pkg_dir}/"
              exit 1
            fi
            echo "Publishing ${pkg_name} from tarball: $(basename "$tarball")..."
            npm publish "$tarball" --provenance --access public
          done <<< "$to_publish"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-check, publish]
    if: ${{ needs.publish.result == 'success' && contains(needs.build-and-check.outputs.toPublish, 'mcp=kibi-mcp') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released package metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Confirm kibi-mcp is in the successful npm release set
        env:
          TO_PUBLISH: ${{ needs.build-and-check.outputs.toPublish }}
        run: |
          if ! grep -Fxq 'mcp=kibi-mcp' <<< "$TO_PUBLISH"; then
            echo "kibi-mcp was not included in this npm release"
            exit 1
          fi
      - name: Install MCP Registry publisher
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"
      - name: Prepare registry manifest from the released npm package
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const packageJson = JSON.parse(await readFile('packages/mcp/package.json', 'utf8'));
          const manifest = JSON.parse(await readFile('packages/mcp/server.json', 'utf8'));
          if (packageJson.name !== 'kibi-mcp') {
            throw new Error(`Unexpected MCP npm package name: ${packageJson.name}`);
          }
          if (packageJson.mcpName !== manifest.name) {
            throw new Error(`npm mcpName ${packageJson.mcpName} does not match registry name ${manifest.name}`);
          }
          const npmPackages = manifest.packages.filter((entry) =>
            entry.registryType === 'npm' && entry.identifier === packageJson.name,
          );
          if (npmPackages.length !== 1) {
            throw new Error(`Expected exactly one registry entry for ${packageJson.name}`);
          }

          manifest.version = packageJson.version;
          npmPackages[0].version = packageJson.version;
          await writeFile('/tmp/kibi-mcp-server.json', `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Prepared MCP Registry version ${packageJson.version}`);
          NODE
      - name: Validate MCP Registry manifest
        run: mcp-publisher validate /tmp/kibi-mcp-server.json
      - name: Verify the published npm package has the registry name
        timeout-minutes: 5
        run: |
          version=$(node -p "require('./packages/mcp/package.json').version")
          expected_name=$(node -p "require('./packages/mcp/package.json').mcpName")
          # npm publish may succeed before the version is available to readers.
          # Bound both npm's request time and the total number of attempts.
          for attempt in $(seq 1 12); do
            if published_name=$(npm view "kibi-mcp@${version}" mcpName \
              --registry=https://registry.npmjs.org \
              --fetch-retries=0 --fetch-timeout=10000); then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published kibi-mcp@${version} is not available after 12 attempts"
              exit 1
            fi
            echo "Waiting for kibi-mcp@${version} to become available (attempt ${attempt}/12)..."
            sleep 10
          done
          if [ "$published_name" != "$expected_name" ]; then
            echo "Published kibi-mcp@${version} has mcpName '${published_name}', expected '${expected_name}'"
            exit 1
          fi
      - name: Authenticate to MCP Registry with GitHub OIDC
        run: mcp-publisher login github-oidc
      - name: Publish kibi-mcp to the official MCP Registry
        run: mcp-publisher publish /tmp/kibi-mcp-server.json

  create-github-releases:
    runs-on: ubuntu-latest
    needs: [publish, build-and-check, check-release]
    if: ${{ needs.publish.result == 'success' && needs.build-and-check.outputs.toPublish != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download VS Code extension VSIX
        uses: actions/download-artifact@v6
        with:
          name: vscode-vsix
          path: packages/vscode
      - name: Create GitHub releases
        run: |
          to_publish="${{ needs.build-and-check.outputs.toPublish }}"
          vsix_file=$(ls -1 packages/vscode/*.vsix 2>/dev/null | head -1)
          while IFS= read -r output; do
            [ -z "$output" ] && continue
            pkg_dir="${output%=*}"
            pkg_name="${output#*=}"
            version=$(node -p "require('./packages/${pkg_dir}/package.json').version")
            tag="${pkg_name}@${version}"

            # Extract the latest changelog entry: content between first and second ## heading
            notes=$(awk '/^## /{if(found) exit; found=1; next} found{print}' "packages/${pkg_dir}/CHANGELOG.md" | sed -e '/./,$!d')

            echo "Creating GitHub release: $tag"
            gh release create "$tag" \
              --title "$tag" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              || echo "Release $tag already exists, skipping"

            # Attach VS Code extension VSIX to every release
            if [ -n "$vsix_file" ]; then
              echo "Attaching VSIX: $(basename "$vsix_file") to $tag"
              gh release upload "$tag" "$vsix_file" --clobber \
                || echo "Failed to attach VSIX to $tag, skipping"
            fi
          done <<< "$to_publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

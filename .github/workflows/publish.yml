name: Publish to npm

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master]

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      release_action: ${{ steps.decide.outputs.action }}
      toPublish: ${{ steps.decide.outputs.toPublish }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Determine release action
        id: decide
        run: |
          DECISION=$(bun run scripts/run-release-state.ts)
          ACTION=$(echo "$DECISION" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(d.action)")
          TO_PUBLISH=$(echo "$DECISION" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));d.toPublish.forEach(x=>console.log(x))")
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "toPublish<<EOF" >> $GITHUB_OUTPUT
          echo "$TO_PUBLISH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Release action: $ACTION"
          echo "$DECISION"

  build-and-check:
    runs-on: ubuntu-latest
    needs: check-release
    if: ${{ needs.check-release.outputs.release_action != 'NOOP' && needs.check-release.outputs.release_action != 'ALREADY_PUBLISHED_NOOP' }}
    outputs:
      toPublish: ${{ steps.check-packages.outputs.toPublish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm auth and tooling
        run: |
          node --version
          npm --version
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      - name: Typecheck matrix
        run: bun run typecheck
      - name: Verify generated schema parity
        run: bun run schema:check

      - name: Build CLI package
        run: bun run build:cli
      - name: Build runtime package
        run: bun run build:runtime
      - name: Build MCP package
        run: bun run build:mcp
      - name: Build Codex plugin package
        run: bun run build:codex
      - name: Build Cursor plugin package
        run: bun run build:cursor
      - name: Build and package VS Code extension
        run: bun run --cwd packages/vscode package
      - name: Clean stale tarballs
        run: bun run clean:tarballs
      - name: Pack packages
        run: |
          cd packages/core && npm pack
          cd ../cli && npm pack
          cd ../runtime && npm pack
          cd ../mcp && npm pack
          cd ../opencode && npm pack
          cd ../codex && npm pack
          cd ../cursor && npm pack
      - name: Upload package tarballs
        uses: actions/upload-artifact@v6
        with:
          name: package-tarballs
          path: |
            packages/core/*.tgz
            packages/cli/*.tgz
            packages/runtime/*.tgz
            packages/mcp/*.tgz
            packages/opencode/*.tgz
            packages/codex/*.tgz
            packages/cursor/*.tgz
          retention-days: 1
      - name: Upload VS Code extension VSIX
        uses: actions/upload-artifact@v6
        with:
          name: vscode-vsix
          path: packages/vscode/*.vsix
          retention-days: 1
      - name: Pass through packages to publish
        id: check-packages
        run: |
          cat >> $GITHUB_OUTPUT <<'EOFMARKER'
          toPublish<<EOF
          ${{ needs.check-release.outputs.toPublish }}
          EOF
          EOFMARKER

  release-gate:
    runs-on: ubuntu-latest
    needs: [build-and-check, check-release]
    if: ${{ always() && needs.build-and-check.result == 'success' && needs.build-and-check.outputs.toPublish != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download package tarballs
        uses: actions/download-artifact@v6
        with:
          name: package-tarballs
          path: packages
      - name: Build CLI workspace for packed typecheck
        run: bun run build:cli
      - name: Tarball content verification
        run: |
          bun test --cwd documentation/tests/e2e/packed --timeout=300000 cli-verify-tarball-core.test.ts packed-path-hygiene.test.ts
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5
      - name: Isolated CLI and MCP package contract verification
        run: |
          corepack enable
          bun test --cwd documentation/tests/e2e/packed --timeout=300000 release-package-contract.test.ts
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10
      - name: Opencode packed behavior verification
        run: |
          bun run compile:e2e:packed
          export NODE_OPTIONS='--enable-source-maps' && bunx node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/opencode-install.test.js /tmp/kibi-e2e-packed-compiled/opencode-plugin.test.js /tmp/kibi-e2e-packed-compiled/opencode-bootstrap-paths.test.js
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10
      - name: Strict install smoke test
        run: |
          mkdir -p /tmp/kibi-smoke-test
          cd /tmp/kibi-smoke-test
          npm init -y
          npm install ${{ github.workspace }}/packages/core/kibi-core-*.tgz
          npm install ${{ github.workspace }}/packages/cli/kibi-cli-*.tgz
          npm install ${{ github.workspace }}/packages/runtime/kibi-runtime-*.tgz
          npm install ${{ github.workspace }}/packages/mcp/kibi-mcp-*.tgz
          npm install ${{ github.workspace }}/packages/opencode/kibi-opencode-*.tgz
          npm install ${{ github.workspace }}/packages/codex/kibi-codex-*.tgz
          ./node_modules/.bin/kibi --version
          ./node_modules/.bin/kibi init --no-hooks
          ./node_modules/.bin/kibi query req
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
        timeout-minutes: 5
      - name: MCP server smoke test
        run: |
          cd /tmp/kibi-smoke-test
          timeout 10s ./node_modules/.bin/kibi-mcp < /dev/null || true
        timeout-minutes: 2

  publish:
    runs-on: ubuntu-latest
    needs: [build-and-check, release-gate, check-release]
    if: ${{ needs.build-and-check.outputs.toPublish != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download package tarballs
        uses: actions/download-artifact@v6
        with:
          name: package-tarballs
          path: packages
      - name: Publish packages
        run: |
          to_publish="${{ needs.build-and-check.outputs.toPublish }}"
          while IFS= read -r output; do
            [ -z "$output" ] && continue
            pkg_dir="${output%=*}"
            pkg_name="${output#*=}"
            tarball=$(ls "${GITHUB_WORKSPACE}/packages/${pkg_dir}"/*.tgz 2>/dev/null | head -1)
            if [ -z "$tarball" ]; then
              echo "No tarball found for ${pkg_name} in packages/${pkg_dir}/"
              exit 1
            fi
            echo "Publishing ${pkg_name} from tarball: $(basename "$tarball")..."
            npm publish "$tarball" --provenance --access public
          done <<< "$to_publish"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-github-releases:
    runs-on: ubuntu-latest
    needs: [publish, build-and-check, check-release]
    if: ${{ needs.publish.result == 'success' && needs.build-and-check.outputs.toPublish != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download VS Code extension VSIX
        uses: actions/download-artifact@v6
        with:
          name: vscode-vsix
          path: packages/vscode
      - name: Create GitHub releases
        run: |
          to_publish="${{ needs.build-and-check.outputs.toPublish }}"
          vsix_file=$(ls -1 packages/vscode/*.vsix 2>/dev/null | head -1)
          while IFS= read -r output; do
            [ -z "$output" ] && continue
            pkg_dir="${output%=*}"
            pkg_name="${output#*=}"
            version=$(node -p "require('./packages/${pkg_dir}/package.json').version")
            tag="${pkg_name}@${version}"

            # Extract the latest changelog entry: content between first and second ## heading
            notes=$(awk '/^## /{if(found) exit; found=1; next} found{print}' "packages/${pkg_dir}/CHANGELOG.md" | sed -e '/./,$!d')

            echo "Creating GitHub release: $tag"
            gh release create "$tag" \
              --title "$tag" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              || echo "Release $tag already exists, skipping"

            # Attach VS Code extension VSIX to every release
            if [ -n "$vsix_file" ]; then
              echo "Attaching VSIX: $(basename "$vsix_file") to $tag"
              gh release upload "$tag" "$vsix_file" --clobber \
                || echo "Failed to attach VSIX to $tag, skipping"
            fi
          done <<< "$to_publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish to npm

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated list of packages to publish (e.g., core,cli,mcp). If empty, auto-detect changed packages.'
        required: false
        default: ''
      dry-run:
        description: 'Perform a dry run (no actual publish)'
        required: false
        default: false
        type: boolean

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      release_action: ${{ steps.decide.outputs.action }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Determine release action
        id: decide
        run: |
          DECISION=$(bun run scripts/run-release-state.ts)
          ACTION=$(echo "$DECISION" | grep '"action"' | head -1 | sed 's/.*"action"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "Release action: $ACTION"
          echo "$DECISION"

  build-and-check:
    runs-on: ubuntu-latest
    needs: check-release
    if: ${{ needs.check-release.outputs.release_action != 'NOOP' && needs.check-release.outputs.release_action != 'ALREADY_PUBLISHED_NOOP' }}
    outputs:
      to_publish: ${{ steps.check-packages.outputs.to_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 0
      - name: Install SWI-Prolog
        run: |
          sudo apt-get install -y software-properties-common
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm auth and tooling
        run: |
          node --version
          npm --version
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile
      - name: Build CLI package
        run: bun run build:cli
      - name: Build MCP package
        run: bun run build:mcp
      - name: Build and package VS Code extension
        run: bun run --cwd packages/vscode package
      - name: Pack packages
        run: |
          cd packages/core && npm pack
          cd ../cli && npm pack
          cd ../mcp && npm pack
          cd ../opencode && npm pack
      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: package-tarballs
          path: |
            packages/core/*.tgz
            packages/cli/*.tgz
            packages/mcp/*.tgz
            packages/opencode/*.tgz
          retention-days: 1
      - name: Upload VS Code extension VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: packages/vscode/*.vsix
          retention-days: 1
      - name: Determine packages to publish
        id: check-packages
        run: |
          to_publish=""
          
          check_package() {
            local pkg_name="$1"
            local pkg_dir="$2"
            local version=$(node -p "require('./packages/${pkg_dir}/package.json').version")
            
            echo "Checking ${pkg_name} local version: ${version}"
            
            if npm view ${pkg_name}@${version} version > /dev/null 2>&1; then
              echo "${pkg_name}@${version} already exists on npm"
              return 0
            else
              echo "${pkg_name}@${version} needs to be published"
              to_publish="${to_publish}${pkg_dir}=${pkg_name}"$'\n'
              return 0
            fi
          }
          
          if [ -n "${{ inputs.packages }}" ]; then
            IFS=',' read -ra PACKAGES <<< "${{ inputs.packages }}"
            for pkg in "${PACKAGES[@]}"; do
              pkg=$(echo $pkg | xargs)
              case $pkg in
                core) check_package "kibi-core" "core" ;;
                cli) check_package "kibi-cli" "cli" ;;
                mcp) check_package "kibi-mcp" "mcp" ;;
                opencode) check_package "kibi-opencode" "opencode" ;;
                vscode) echo "kibi-vscode is distributed via VSIX on GitHub Releases, not npm" ;;
                *) echo "Unknown package: $pkg" ;;
              esac
            done
          else
            check_package "kibi-core" "core"
            check_package "kibi-cli" "cli"
            check_package "kibi-mcp" "mcp"
            check_package "kibi-opencode" "opencode"
          fi
          
          echo "to_publish<<EOF" >> $GITHUB_OUTPUT
          echo -n "$to_publish" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  release-gate:
    runs-on: ubuntu-latest
    needs: [build-and-check, check-release]
    if: ${{ always() && needs.build-and-check.result == 'success' && needs.build-and-check.outputs.to_publish != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 0
      - name: Install SWI-Prolog
        run: |
          sudo apt-get install -y software-properties-common
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download package tarballs
        uses: actions/download-artifact@v4
        with:
          name: package-tarballs
          path: packages
      - name: Tarball content verification
        run: |
          bun test --timeout=300000 documentation/tests/e2e/packed/cli-verify-tarball-core.test.ts
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5
      - name: Opencode packed behavior verification
        run: |
          rm -rf /tmp/kibi-e2e-packed-compiled
          bunx tsc -p documentation/tests/e2e/packed/tsconfig.e2e.json --outDir /tmp/kibi-e2e-packed-compiled --noEmitOnError false || true
          export NODE_OPTIONS='--enable-source-maps' && bunx node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/opencode-install.test.js /tmp/kibi-e2e-packed-compiled/opencode-plugin.test.js /tmp/kibi-e2e-packed-compiled/opencode-bootstrap-paths.test.js
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10
      - name: Strict install smoke test
        run: |
          mkdir -p /tmp/kibi-smoke-test
          cd /tmp/kibi-smoke-test
          npm init -y
          npm install ${{ github.workspace }}/packages/core/kibi-core-*.tgz
          npm install ${{ github.workspace }}/packages/cli/kibi-cli-*.tgz
          npm install ${{ github.workspace }}/packages/mcp/kibi-mcp-*.tgz
          npm install ${{ github.workspace }}/packages/opencode/kibi-opencode-*.tgz
          ./node_modules/.bin/kibi --version
          ./node_modules/.bin/kibi init --no-hooks
          ./node_modules/.bin/kibi query req
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
        timeout-minutes: 5
      - name: MCP server smoke test
        run: |
          cd /tmp/kibi-smoke-test
          timeout 10s ./node_modules/.bin/kibi-mcp < /dev/null || true
        timeout-minutes: 2

  publish:
    runs-on: ubuntu-latest
    needs: [build-and-check, release-gate, check-release]
    if: ${{ needs.build-and-check.outputs.to_publish != '' && inputs.dry-run != true }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Download package tarballs
        uses: actions/download-artifact@v4
        with:
          name: package-tarballs
          path: packages
      - name: Publish packages
        run: |
          to_publish="${{ needs.build-and-check.outputs.to_publish }}"
          while IFS= read -r output; do
            [ -z "$output" ] && continue
            pkg_dir="${output%=*}"
            pkg_name="${output#*=}"
            tarball=$(ls "${GITHUB_WORKSPACE}/packages/${pkg_dir}"/*.tgz 2>/dev/null | head -1)
            if [ -z "$tarball" ]; then
              echo "No tarball found for ${pkg_name} in packages/${pkg_dir}/"
              exit 1
            fi
            echo "Publishing ${pkg_name} from tarball: $(basename "$tarball")..."
            npm publish "$tarball" --provenance --access public
          done <<< "$to_publish"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-github-releases:
    runs-on: ubuntu-latest
    needs: [publish, build-and-check, check-release]
    if: ${{ needs.publish.result == 'success' && needs.build-and-check.outputs.to_publish != '' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/heads/master
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download VS Code extension VSIX
        uses: actions/download-artifact@v4
        with:
          name: vscode-vsix
          path: packages/vscode
      - name: Create GitHub releases
        run: |
          to_publish="${{ needs.build-and-check.outputs.to_publish }}"
          vsix_file=$(ls -1 packages/vscode/*.vsix 2>/dev/null | head -1)
          while IFS= read -r output; do
            [ -z "$output" ] && continue
            pkg_dir="${output%=*}"
            pkg_name="${output#*=}"
            version=$(node -p "require('./packages/${pkg_dir}/package.json').version")
            tag="${pkg_name}@${version}"

            # Extract the latest changelog entry: content between first and second ## heading
            notes=$(awk '/^## /{if(found) exit; found=1; next} found{print}' "packages/${pkg_dir}/CHANGELOG.md" | sed -e '/./,$!d')

            echo "Creating GitHub release: $tag"
            gh release create "$tag" \
              --title "$tag" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              || echo "Release $tag already exists, skipping"

            # Attach VS Code extension VSIX to every release
            if [ -n "$vsix_file" ]; then
              echo "Attaching VSIX: $(basename "$vsix_file") to $tag"
              gh release upload "$tag" "$vsix_file" --clobber \
                || echo "Failed to attach VSIX to $tag, skipping"
            fi
          done <<< "$to_publish"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CLA

# Asks every outside contributor to accept the Kibi Contributor License
# Agreement (CLA.md) before their pull request can merge. A contributor
# signs by commenting the sentence below on the pull request; the action
# records the signature in signatures/cla.json on the `cla-signatures`
# branch, which holds only that file and no workflows. The maintainer and
# bots are on the allowlist and are never asked.
#
# pull_request_target runs this workflow from the base branch with write
# access, so it must never check out or run the pull request's code. It
# doesn't: the job only calls the GitHub API.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: kibi-cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Kibi CLA Document and I hereby sign the CLA'))
    steps:
      - name: Create the signatures branch if it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/heads/cla-signatures" >/dev/null 2>&1; then
            exit 0
          fi
          readme=$(printf '%s\n' \
            '# Kibi CLA signatures' '' \
            'Signatures of the Kibi Contributor License Agreement (CLA.md on the default branch),' \
            'recorded by the CLA workflow. Do not edit by hand.' | base64 -w0)
          blob=$(gh api "repos/$REPO/git/blobs" -f content="$readme" -f encoding=base64 --jq .sha)
          tree=$(gh api "repos/$REPO/git/trees" \
            -f 'tree[][path]=README.md' -f 'tree[][mode]=100644' \
            -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)
          commit=$(gh api "repos/$REPO/git/commits" \
            -f message='chore: start the CLA signatures branch' -f tree="$tree" --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$commit" >/dev/null

      - name: Check CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/develop/CLA.md
          branch: cla-signatures
          allowlist: Looted,*[bot]
          custom-pr-sign-comment: I have read the Kibi CLA Document and I hereby sign the CLA
          create-file-commit-message: "chore: create the CLA signatures file"
          signed-commit-message: "chore: $contributorName signed the CLA in $owner/$repo#$pullRequestNo"
          lock-pullrequest-aftermerge: false

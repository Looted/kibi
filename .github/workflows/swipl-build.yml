name: SWI-Prolog platform builds

on:
  push:
    branches: [develop, codex/swipl-bundle-spike]
    paths:
      - .github/workflows/swipl-build.yml
      - scripts/swipl-version.json
      - scripts/swipl-spike.py
      - scripts/swipl-spike.sh
      - scripts/swipl-windows-repack.py
      - scripts/tests/swipl-windows-repack.test.ts
      - scripts/patches/swipl-*.patch
      - scripts/tests/swipl-spike-config.test.ts
      - scripts/tests/swipl-build-*.test.ts
  workflow_dispatch:
  # Publish and every non-pull-request caller build the archives in this run
  # from this commit. The default archive-cache mode is off: no restore and no
  # save, so a released package cannot be a cached build. A pull-request dry
  # run passes read and may restore an archive whose key still matches. A
  # develop push of the dry run passes write: it still builds from source, then
  # saves that archive so later pull requests can restore it.
  workflow_call:
    inputs:
      archive-cache:
        description: >
          off (default) builds from source and does not touch the cache.
          read restores a matching archive and builds from source on a miss.
          write always builds from source, then saves a new key.
        type: string
        default: "off"

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate artifact directory
        id: paths
        run: echo "dir=$RUNNER_TEMP/swipl-build/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      # Exact key, no restore-keys. A pin, patch, script, or workflow change
      # misses instead of restoring an older archive. write looks up only, so
      # this step never replaces the from-source build.
      - name: Restore a cached archive
        id: cache
        if: success() && (inputs.archive-cache == 'read' || inputs.archive-cache == 'write')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ inputs.archive-cache == 'write' }}
          path: ${{ runner.temp }}/swipl-release-cache/${{ matrix.target }}
          key: swipl-release-archive-${{ matrix.target }}-${{ hashFiles('scripts/swipl-version.json', 'scripts/swipl-spike.py', 'scripts/swipl-spike.sh', 'scripts/swipl-windows-repack.py', 'scripts/patches/swipl-*.patch', '.github/workflows/swipl-build.yml') }}
      - name: Use the restored archive
        if: success() && inputs.archive-cache == 'read' && steps.cache.outputs.cache-hit == 'true'
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
          CACHE_DIR: ${{ runner.temp }}/swipl-release-cache/${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p "$BUILD_DIR"
          archives=("$CACHE_DIR"/swipl-*.tar.gz)
          sidecars=("$CACHE_DIR"/swipl-*.tar.gz.sha256)
          test "${#archives[@]}" -eq 1
          test "${#sidecars[@]}" -eq 1
          cp "${archives[0]}" "${sidecars[0]}" "$CACHE_DIR/report.json" "$BUILD_DIR/"
      - name: Require no preinstalled SWI-Prolog
        if: success() && (inputs.archive-cache != 'read' || steps.cache.outputs.cache-hit != 'true')
        run: |
          if command -v swipl; then exit 1; fi
      - name: Install native build and audit tools
        if: success() && (inputs.archive-cache != 'read' || steps.cache.outputs.cache-hit != 'true')
        run: |
          dnf install -y perl-core make gcc gcc-c++ binutils file
          /opt/python/cp311-cp311/bin/python -m pip install --no-cache-dir cmake==3.31.10 ninja==1.13.0 patchelf==0.17.2.4
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - name: Build, relocate, audit, and smoke
        if: success() && (inputs.archive-cache != 'read' || steps.cache.outputs.cache-hit != 'true')
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
        run: bash scripts/swipl-spike.sh build-archive --target '${{ matrix.target }}' --workdir "$BUILD_DIR"
      - name: Record archive cache status
        if: success()
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
          ARCHIVE_CACHE_MODE: ${{ inputs.archive-cache }}
          ARCHIVE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$ARCHIVE_CACHE_MODE" == "read" && "$ARCHIVE_CACHE_HIT" == "true" ]]; then
            printf 'hit\n' > "$BUILD_DIR/cache-status"
            status=hit
          else
            printf 'miss\n' > "$BUILD_DIR/cache-status"
            status=miss
          fi
          echo "swipl ${{ matrix.target }} archive cache: $status" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: swipl-build-report-${{ matrix.target }}
          path: ${{ steps.paths.outputs.dir }}/report.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: swipl-${{ matrix.target }}
          path: |
            ${{ steps.paths.outputs.dir }}/swipl-*.tar.gz
            ${{ steps.paths.outputs.dir }}/swipl-*.tar.gz.sha256
            ${{ steps.paths.outputs.dir }}/report.json
            ${{ steps.paths.outputs.dir }}/cache-status
          if-no-files-found: error
          retention-days: 7
      - name: Stage the archive cache
        if: success() && (inputs.archive-cache == 'read' || inputs.archive-cache == 'write') && steps.cache.outputs.cache-hit != 'true'
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
          CACHE_DIR: ${{ runner.temp }}/swipl-release-cache/${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf "$CACHE_DIR"
          mkdir -p "$CACHE_DIR"
          archives=("$BUILD_DIR"/swipl-*.tar.gz)
          sidecars=("$BUILD_DIR"/swipl-*.tar.gz.sha256)
          test "${#archives[@]}" -eq 1
          test "${#sidecars[@]}" -eq 1
          cp "${archives[0]}" "${sidecars[0]}" "$BUILD_DIR/report.json" "$CACHE_DIR/"
      - name: Save the archive cache
        if: success() && (inputs.archive-cache == 'read' || inputs.archive-cache == 'write') && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: ${{ inputs.archive-cache == 'read' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swipl-release-cache/${{ matrix.target }}
          key: swipl-release-archive-${{ matrix.target }}-${{ hashFiles('scripts/swipl-version.json', 'scripts/swipl-spike.py', 'scripts/swipl-spike.sh', 'scripts/swipl-windows-repack.py', 'scripts/patches/swipl-*.patch', '.github/workflows/swipl-build.yml') }}

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Locate artifact directory
        id: paths
        run: echo "dir=$RUNNER_TEMP/swipl-build/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: Restore a cached archive
        id: cache
        if: success() && (inputs.archive-cache == 'read' || inputs.archive-cache == 'write')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: ${{ inputs.archive-cache == 'write' }}
          path: ${{ runner.temp }}/swipl-release-cache/${{ matrix.target }}
          key: swipl-release-archive-${{ matrix.target }}-${{ hashFiles('scripts/swipl-version.json', 'scripts/swipl-spike.py', 'scripts/swipl-spike.sh', 'scripts/swipl-windows-repack.py', 'scripts/patches/swipl-*.patch', '.github/workflows/swipl-build.yml') }}
      - name: Use the restored archive
        if: success() && inputs.archive-cache == 'read' && steps.cache.outputs.cache-hit == 'true'
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
          CACHE_DIR: ${{ runner.temp }}/swipl-release-cache/${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p "$BUILD_DIR"
          archives=("$CACHE_DIR"/swipl-*.tar.gz)
          sidecars=("$CACHE_DIR"/swipl-*.tar.gz.sha256)
          test "${#archives[@]}" -eq 1
          test "${#sidecars[@]}" -eq 1
          cp "${archives[0]}" "${sidecars[0]}" "$CACHE_DIR/report.json" "$BUILD_DIR/"
      - name: Require no preinstalled SWI-Prolog
        if: success() && (inputs.archive-cache != 'read' || steps.cache.outputs.cache-hit != 'true')
        run: |
          if command -v swipl; then exit 1; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: success() && (inputs.archive-cache != 'read' || steps.cache.outputs.cache-hit != 'true')
        with:
          python-version: '3.12'
      - name: Install pinned build tools and check native audits
        if: success() && (inputs.archive-cache != 'read' || steps.cache.outputs.cache-hit != 'true')
        run: |
          python3 -m pip install cmake==3.31.10 ninja==1.13.0
          command -v make
          command -v install_name_tool
          command -v codesign
          command -v otool
      - name: Build, relocate, sign, audit, and smoke
        if: success() && (inputs.archive-cache != 'read' || steps.cache.outputs.cache-hit != 'true')
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
        run: bash scripts/swipl-spike.sh build-archive --target '${{ matrix.target }}' --workdir "$BUILD_DIR"
      - name: Record archive cache status
        if: success()
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
          ARCHIVE_CACHE_MODE: ${{ inputs.archive-cache }}
          ARCHIVE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$ARCHIVE_CACHE_MODE" == "read" && "$ARCHIVE_CACHE_HIT" == "true" ]]; then

name: SWI-Prolog platform builds

on:
  push:
    branches: [develop, codex/swipl-bundle-spike]
    paths:
      - .github/workflows/swipl-build.yml
      - scripts/swipl-version.json
      - scripts/swipl-spike.py
      - scripts/swipl-spike.sh
      - scripts/patches/swipl-*.patch
      - scripts/tests/swipl-spike-config.test.ts
      - scripts/tests/swipl-build-*.test.ts
  workflow_dispatch:
  # Release workflows build the archives themselves, in their own run and from
  # their own commit, so the artifacts they package were produced by this exact
  # source and pins and never come from an earlier or foreign run.
  workflow_call:

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Require no preinstalled SWI-Prolog
        run: |
          if command -v swipl; then exit 1; fi
      - name: Install native build and audit tools
        run: |
          dnf install -y perl-core make gcc gcc-c++ binutils file
          /opt/python/cp311-cp311/bin/python -m pip install --no-cache-dir cmake==3.31.10 ninja==1.13.0 patchelf==0.17.2.4
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - name: Locate artifact directory
        id: paths
        run: echo "dir=$RUNNER_TEMP/swipl-build/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: Build, relocate, audit, and smoke
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
        run: bash scripts/swipl-spike.sh build-archive --target '${{ matrix.target }}' --workdir "$BUILD_DIR"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-build-report-${{ matrix.target }}
          path: ${{ steps.paths.outputs.dir }}/report.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: swipl-${{ matrix.target }}
          path: |
            ${{ steps.paths.outputs.dir }}/swipl-*.tar.gz
            ${{ steps.paths.outputs.dir }}/swipl-*.tar.gz.sha256
            ${{ steps.paths.outputs.dir }}/report.json
          if-no-files-found: error
          retention-days: 7

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Require no preinstalled SWI-Prolog
        run: |
          if command -v swipl; then exit 1; fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned build tools and check native audits
        run: |
          python3 -m pip install cmake==3.31.10 ninja==1.13.0
          command -v make
          command -v install_name_tool
          command -v codesign
          command -v otool
      - name: Locate artifact directory
        id: paths
        run: echo "dir=$RUNNER_TEMP/swipl-build/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: Build, relocate, sign, audit, and smoke
        env:
          BUILD_DIR: ${{ steps.paths.outputs.dir }}
        run: bash scripts/swipl-spike.sh build-archive --target '${{ matrix.target }}' --workdir "$BUILD_DIR"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-build-report-${{ matrix.target }}
          path: ${{ steps.paths.outputs.dir }}/report.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: swipl-${{ matrix.target }}
          path: |
            ${{ steps.paths.outputs.dir }}/swipl-*.tar.gz
            ${{ steps.paths.outputs.dir }}/swipl-*.tar.gz.sha256
            ${{ steps.paths.outputs.dir }}/report.json
          if-no-files-found: error
          retention-days: 7

  smoke-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Require clean consumer before artifact download
        run: |
          if command -v swipl; then exit 1; fi
      - name: Install audit tools only
        run: |
          dnf install -y binutils file
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
      - name: Locate clean consumer directories
        id: paths
        run: |
          echo "artifacts=$RUNNER_TEMP/swipl-artifact/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "work=$RUNNER_TEMP/swipl-smoke/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: swipl-${{ matrix.target }}
          path: ${{ steps.paths.outputs.artifacts }}
      - name: Verify archive, native files, and extracted runtime
        shell: bash
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifacts }}
          SMOKE_DIR: ${{ steps.paths.outputs.work }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$ARTIFACT_DIR"/*.tar.gz)
          test "${#archives[@]}" -eq 1
          bash scripts/swipl-spike.sh smoke-archive --target '${{ matrix.target }}' \
            --archive "${archives[0]}" --checksum "${archives[0]}.sha256" --workdir "$SMOKE_DIR"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-smoke-${{ matrix.target }}
          path: ${{ steps.paths.outputs.work }}/report.json
          if-no-files-found: error
          retention-days: 7

  smoke-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Require clean consumer before artifact download
        run: |
          if command -v swipl; then exit 1; fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Locate clean consumer directories
        id: paths
        run: |
          echo "artifacts=$RUNNER_TEMP/swipl-artifact/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "work=$RUNNER_TEMP/swipl-smoke/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: swipl-${{ matrix.target }}
          path: ${{ steps.paths.outputs.artifacts }}
      - name: Verify archive, signatures, and extracted runtime
        shell: bash
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifacts }}
          SMOKE_DIR: ${{ steps.paths.outputs.work }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$ARTIFACT_DIR"/*.tar.gz)
          test "${#archives[@]}" -eq 1
          bash scripts/swipl-spike.sh smoke-archive --target '${{ matrix.target }}' \
            --archive "${archives[0]}" --checksum "${archives[0]}.sha256" --workdir "$SMOKE_DIR"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: swipl-smoke-${{ matrix.target }}
          path: ${{ steps.paths.outputs.work }}/report.json
          if-no-files-found: error
          retention-days: 7

          fi
          bash scripts/swipl-spike.sh smoke-archive --target '${{ matrix.target }}' \
            --archive "${archives[0]}" --checksum "${archives[0]}.sha256" --workdir "$SMOKE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: swipl-smoke-${{ matrix.target }}
          path: ${{ steps.paths.outputs.work }}/report.json
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require clean consumer before artifact download
        run: |
          if command -v swipl swipl.exe; then exit 1; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Locate clean consumer directories
        id: paths
        run: |
          echo "artifacts=$RUNNER_TEMP/swipl-artifact/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "work=$RUNNER_TEMP/swipl-smoke/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swipl-${{ matrix.target }}
          path: ${{ steps.paths.outputs.artifacts }}
      - name: Verify archive, native files, and extracted runtime
        env:
          ARTIFACT_DIR: ${{ steps.paths.outputs.artifacts }}
          SMOKE_DIR: ${{ steps.paths.outputs.work }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$ARTIFACT_DIR"/*.tar.gz)
          test "${#archives[@]}" -eq 1
          if [[ "$(cat "$ARTIFACT_DIR/cache-status")" == "hit" ]]; then
            unset GITHUB_SHA GITHUB_RUN_ID
          fi
          python3 scripts/swipl-windows-repack.py smoke-archive --target win32-x64             --archive "${archives[0]}" --checksum "${archives[0]}.sha256" --workdir "$SMOKE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: swipl-smoke-${{ matrix.target }}
          path: ${{ steps.paths.outputs.work }}/report.json
          if-no-files-found: error
          retention-days: 7

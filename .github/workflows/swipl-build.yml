      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: swipl-build-report-${{ matrix.target }}
          path: ${{ steps.paths.outputs.dir }}/report.json
          if-no-files-found: warn

        continue-on-error: ${{ inputs.archive-cache == 'read' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swipl-release-cache/${{ matrix.target }}
          key: swipl-release-archive-${{ matrix.target }}-${{ hashFiles('scripts/swipl-version.json', 'scripts/swipl-spike.py', 'scripts/swipl-spike.sh', 'scripts/swipl-windows-repack.py', 'scripts/patches/swipl-*.patch', '.github/workflows/swipl-build.yml') }}

  smoke-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require clean consumer before artifact download

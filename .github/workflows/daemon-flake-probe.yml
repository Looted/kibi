name: Daemon flake probe

on:
  push:
    branches: [claude/project-thread-3u9ja1-daemon-flake-probe]

permissions:
  contents: read

jobs:
  swipl-bundle:
    uses: ./.github/workflows/swipl-ci-bundle.yml

  probe:
    needs: [swipl-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
        bun: ['1.4.2']
        cov: ['--coverage']
        variant: ['baseline', 'no-unref']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/use-bundled-swipl
      - run: bun run build
      - name: Standalone pipe stall repro
        run: |
          for m in node node-sock node-sock; do timeout 120 bun scripts/probe/bun-pipe-stall.ts $m 3000 || echo "exit $?"; done
      - name: Loop the in-process daemon file under coverage
        run: |
          bun --version; lscpu | grep -E "Model name|^CPU\(s\)"
          fails=0
          for i in 1 2 3 4 5; do
            rt=$(mktemp -d)
            KIBI_PROBE_VARIANT=${{ matrix.variant }} NODE_ENV=test KIBI_ENGINE_IDLE_TIMEOUT_MS=30000 KIBI_RUNTIME_DIR=$rt CODEX_HOME=$rt/codex-home \
              bun test ${{ matrix.cov }} --timeout 15000 --isolate --max-concurrency=1 \
              ./packages/cli/tests/engine-daemon-inprocess.test.ts > "run$i.log" 2>&1 || fails=$((fails+1))
            echo "== run $i"
            grep -E "PROBE|\(fail\)|error:| pass$| fail$" "run$i.log" | grep -v "PROBE shutdown \(saved\|detached\|terminated\) [0-9]\{1,2\} " | head -80
          done
          echo "fails=$fails"

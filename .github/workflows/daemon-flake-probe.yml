name: Daemon flake probe

on:
  push:
    branches: [claude/project-thread-3u9ja1-daemon-flake-probe]

permissions:
  contents: read

jobs:
  swipl-bundle:
    uses: ./.github/workflows/swipl-ci-bundle.yml

  probe:
    needs: [swipl-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
        bun: ['1.4.2']
        cov: ['--coverage']
        variant: ['baseline']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/use-bundled-swipl
      - run: bun run build
      - name: Strace the serves test until it stalls
        run: |
          sudo apt-get install -y strace >/dev/null 2>&1 || true
          mkdir -p traces
          for i in 1 2 3 4 5 6 7 8; do
            rt=$(mktemp -d)
            KIBI_PROBE_VARIANT=baseline NODE_ENV=test KIBI_ENGINE_IDLE_TIMEOUT_MS=30000 KIBI_RUNTIME_DIR=$rt \
              strace -f -tt -T -o traces/t$i.txt -e trace=epoll_ctl,epoll_wait,epoll_pwait,epoll_pwait2,read,recvfrom,recvmsg,write,writev,sendmsg,close,socketpair,pipe2 \
              bun test --coverage --timeout 60000 ./packages/cli/tests/engine-daemon-inprocess.test.ts -t "serves EngineClient" > traces/run$i.log 2>&1 || true
            if grep -q '"elapsed":20' traces/run$i.log; then echo "stall in run $i"; else rm -f traces/t$i.txt; fi
          done
          ls -la traces
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-${{ matrix.slot }}
          path: traces/

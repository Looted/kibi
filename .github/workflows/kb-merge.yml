name: Kibi KB merge

# When develop moves, open pull requests often stop merging only because both
# sides appended records to .kb/symbols.yaml (or a .kb/relationships shard).
# GitHub's mergeability check never runs a custom merge driver, so this
# workflow does it with actions/kb-merge, the same action Kibi publishes for
# other repositories (docs/github-integration.md): it merges develop into each
# such same-repository PR branch with `kibi merge-driver`, compiles the merged
# KB, runs the proof gate, and pushes the merge commit. PRs with any other
# conflict, or a real conflict inside a manifest, are left for a person. A
# branch that moves while it is being merged is merged again.
#
# It runs when develop moves (every open PR) and when any other branch is
# pushed (that branch's PR only, if it has one): a push that adds records to a
# manifest develop already changed conflicts at once, and a branch whose
# earlier merge was refused gets another try. GitHub does not start
# pull_request workflows for a PR that has conflicts, so push is the trigger.
#
# Pushes made with the default GITHUB_TOKEN do not start other workflows, so
# the PR's checks would not re-run on the merge commit. Add a repository
# secret KIBI_MERGE_TOKEN (a fine-grained token or GitHub App token limited
# to this repository, with Contents and Workflows read/write) to have the push
# trigger CI. Workflows access is needed because a merge that brings in
# changes under .github/workflows/ is rejected without it; GITHUB_TOKEN can
# never push those merges. An expired secret fails the job; it does not fall
# back to GITHUB_TOKEN.

concurrency:
  group: kibi-kb-merge-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Kibi's own CI never sends anonymous usage telemetry.
  KIBI_TELEMETRY: "0"

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  find-conflicts:
    name: Find PRs blocked only by KB manifests
    if: ${{ github.ref_name != 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branches: ${{ steps.find.outputs.branches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: List PR branches whose only conflicts are KB manifests
        id: find
        uses: ./actions/kb-merge
        with:
          base: develop
          # A push to develop (or a manual run) checks every open PR; a push
          # to any other branch checks only that branch.
          branches: ${{ github.event_name == 'push' && github.ref_name != 'develop' && github.ref_name || '' }}
          list-only: "true"

  swipl-bundle:
    name: Bundled SWI-Prolog
    needs: [find-conflicts]
    if: ${{ needs.find-conflicts.outputs.branches != '[]' }}
    uses: ./.github/workflows/swipl-ci-bundle.yml

  resolve:
    name: Merge develop into the listed PRs
    needs: [find-conflicts, swipl-bundle]
    if: ${{ needs.find-conflicts.outputs.branches != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
    steps:
      # The merge driver, the KB compiler and the proof gate come from
      # develop, not the PR branch: a branch that predates them has no
      # `kibi merge-driver`, and its own lockfile or build may be stale until
      # develop is merged in. The PR branches are merged in scratch worktrees
      # of this checkout and never installed or built; its credentials push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.KIBI_MERGE_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build Kibi from develop
        run: |
          bun install --frozen-lockfile
          bun run build:cli-stack

      - name: Install SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl

      # The check is the proof gate a person runs before pushing (integrity
      # rules and every requirement's evidence floor), evaluated with
      # develop's Kibi build on the merged tree. A failure leaves the PR
      # untouched for a person instead of pushing a merge that breaks it.
      - name: Merge develop with the Kibi merge driver, proof-check, push
        uses: ./actions/kb-merge
        env:
          KIBI_CLI: ${{ github.workspace }}/packages/cli/bin/kibi
        with:
          base: develop
          branches: ${{ needs.find-conflicts.outputs.branches }}
          kibi: node ${{ github.workspace }}/packages/cli/bin/kibi
          check: sh scripts/proof-gate.sh

name: Mutation (tree-sitter readers)

# Stryker gate for kibi-plugin-treesitter's source-proof readers
# (stryker.treesitter.conf.mjs, see docs/mutation-testing.md). It runs
# only when dispatched by hand.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Kibi's own CI never sends anonymous usage telemetry.
  KIBI_TELEMETRY: "0"

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  mutation-treesitter:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile

      # The plugin tests import kibi-plugin-sdk's dist.
      - name: Build packages
        run: bun run build

      - name: Run mutation suite
        run: bun run test:mutation:treesitter

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: treesitter-mutation-report
          path: reports/mutation/treesitter/
          if-no-files-found: ignore
          retention-days: 14

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Kibi's own CI never sends anonymous usage telemetry.
  KIBI_TELEMETRY: "0"

permissions:
  contents: read
  # The train reuse job reads the member run's attestation artifact.
  actions: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs (build still runs)'
        type: boolean
        default: false
        required: false

jobs:
  # A train of one pull request whose assembled tree is the tree its member
  # already passed does not run the jobs below. Any other train, and every
  # other event, runs them. A skipped reuse job (the usual pull request)
  # starts those jobs immediately.
  reuse:
    name: Decide whether this train can reuse its member's checks
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'merge-train/') && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.decide.outcome == 'success' && steps.decide.outputs.reuse == 'true' && 'false' || 'true' }}
      member-run-id: ${{ steps.decide.outputs.source_run_id }}
      member-run-url: ${{ steps.decide.outputs.source_run_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Depth 2 keeps the train head, the second parent of this pull
          # request's merge commit. The member commit is fetched by the script.
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Decide whether the member's checks cover this tree
        id: decide
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KIBI_REUSE_WORKFLOW: .github/workflows/ci.yml
          KIBI_REUSE_ARTIFACT: kibi-ci-attestation
          KIBI_REUSE_CHECK: ci-required
        run: bun scripts/ci-check-reuse.ts decide "$RUNNER_TEMP/kibi-check-decision.json"

  ci-typecheck-build:
    needs: [reuse]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
        env:
          NODE_INSTALLER: npm
      - name: Verify npm is available
        run: npm --version

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      # Snyk's GitHub import cannot read bun.lock, so bun.lock is audited here.
      # Every ignore needs a reason; drop it once a fixed version ships.
      # GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 has no fixed release; kibi-cli only
      # expands glob patterns from the local project config, never remote input.
      # GHSA-fc5q-39xc-vjpf: picomatch <=4.0.7 has no fixed release; it comes in
      # through fast-glob and tinyglobby, which match the same local patterns.
      - name: Audit JS dependencies
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-fc5q-39xc-vjpf

      - name: Check Codex hook bundle drift
        run: bun run --filter kibi-codex check:hook-bundle

      - name: Check Claude hook bundle drift
        run: bun run --filter kibi-claude check:hook-bundle

      - name: Check Cursor hook bundle drift
        run: bun run --filter kibi-cursor check:hook-bundle

      - name: Check Vibe skill mirror drift
        run: bun run --filter kibi-vibe check:skills

      - name: Check Vibe hook bundle drift
        run: bun run --filter kibi-vibe check:hook-bundle

      - name: Check ZCode hook bundle drift
        run: bun run --filter kibi-zcode check:hook-bundle

      - name: Verify generated symbol classification parity
        run: bun run symbols:check

      - name: Verify symbol classification generation and formatting are stable
        run: |
          bun run symbols:generate
          ./node_modules/.bin/biome format --write packages/cli/src/public/symbol-granularity.generated.ts
          bun run symbols:check
          git diff --exit-code -- packages/cli/src/public/symbol-granularity.generated.ts packages/core/src/symbol_classification.pl

      - name: Typecheck matrix
        run: bun run typecheck

      - name: Build packages
        run: bun run build

      - name: Verify approved source analyzer closure
        run: node scripts/qualify-source-analyzers.mjs

      - name: Test source analysis contracts and offline parsers
        run: |
          bun test ./packages/plugin-sdk/tests ./packages/plugin-builtin/tests
          bun run --cwd packages/plugin-treesitter test
          bun run --cwd packages/plugin-search-hints test

  # Builds (or restores from cache) the linux-x64-gnu SWI-Prolog archive that
  # ships in kibi-swipl-linux-x64-gnu; every Prolog job except ci-integration
  # runs it. See .github/workflows/swipl-ci-bundle.yml.
  swipl-bundle:
    needs: [reuse]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && !inputs.skip_tests }}
    uses: ./.github/workflows/swipl-ci-bundle.yml

  # The unit suite runs as cost-balanced partitions in parallel jobs (see
  # partitionShards in scripts/run-unit-coverage.ts). Costs come from the
  # measured shard wall times in scripts/unit-coverage-costs.json, replaced
  # by the cache this workflow saves after each green run. Each partition
  # publishes its per-shard LCOV; ci-unit-coverage-merge combines them and
  # applies the repository coverage floor and source-manifest audit once.
  ci-unit-coverage:
    name: ci-unit-coverage (${{ matrix.partition }}/4)
    needs: [reuse, swipl-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && !inputs.skip_tests && needs.swipl-bundle.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
        with:
          verify-resolver: 'true'

      - name: Build packages needed by unit coverage
        run: bun run build

      - name: Restore measured shard costs
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/unit-coverage-costs.json
          # A miss falls through to the committed seed. The next green run
          # saves a new key under the same prefix.
          key: unit-coverage-costs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: unit-coverage-costs-

      - name: Run unit tests with coverage
        env:
          KIBI_UNIT_COVERAGE_COSTS: ${{ runner.temp }}/unit-coverage-costs.json
        run: bun run test:coverage:unit --partition=${{ matrix.partition }}/4

      - name: Upload partition shard coverage
        if: ${{ !cancelled() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-partition-${{ matrix.partition }}
          path: |
            coverage/unit/lcov.*.info
            coverage/unit/results.*.json
            coverage/unit/failed-shards.txt
          if-no-files-found: error
          retention-days: 1
          # A re-run of a failed partition must replace the artifact its first
          # attempt uploaded; otherwise the merge job downloads the stale one
          # (with failed-shards.txt) and fails again on a green re-run.
          overwrite: true

  ci-unit-coverage-merge:
    name: ci-unit-coverage
    needs: [reuse, ci-unit-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs even when a partition fails so this check reports the failure
    # instead of showing as skipped. A reused train skips it with the partitions.
    if: ${{ always() && !cancelled() && !inputs.skip_tests && github.actor != 'nektos/act' && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') }}
    steps:
      - name: Require every partition to pass
        if: ${{ needs.ci-unit-coverage.result != 'success' }}
        run: |
          echo "::error::Unit coverage partitions finished with '${{ needs.ci-unit-coverage.result }}'."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Download partition shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-coverage-partition-*
          # Outside coverage/ so Codecov's file search does not upload the
          # per-partition copies alongside the merged report.
          path: ${{ runner.temp }}/unit-coverage-partitions

      - name: Restore measured shard costs
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/unit-coverage-costs.json
          key: unit-coverage-costs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: unit-coverage-costs-

      - name: Merge unit coverage and enforce repository gates
        env:
          KIBI_UNIT_COVERAGE_COSTS: ${{ runner.temp }}/unit-coverage-costs.json
        run: bun run test:coverage:unit --merge="$RUNNER_TEMP/unit-coverage-partitions"

      - name: Save measured shard costs
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: coverage/unit/shard-costs.json
          key: unit-coverage-costs-${{ github.run_id }}-${{ github.run_attempt }}

      # Per-file results bound to this commit. The proof workflow for the same
      # commit reuses clean files instead of running them a second time.
      - name: Upload unit test results
        if: ${{ !cancelled() && hashFiles('coverage/unit/test-results.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: coverage/unit/test-results.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload unit coverage artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: |
            coverage/unit/lcov.info
            coverage/unit/coverage-summary.txt
            coverage/unit/source-manifest.txt
            coverage/unit/missing-source-files.txt
            coverage/unit/failed-shards.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit coverage to Codecov
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Install the official CLI from PyPI while the binary CDN fails TLS.
          use_pypi: true
          files: ./coverage/unit/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-coverage
          fail_ci_if_error: true
          verbose: true

  ci-integration:
    needs: [reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && !inputs.skip_tests }}
    # The one job that keeps testing a system SWI-Prolog: installed by
    # scripts/ci-install-swi-prolog.sh, found on PATH, and selected explicitly
    # with KIBI_SWIPL=system so the bundle can never be used here. Every other
    # Prolog job runs the pipeline-built bundle that ships to users.
    env:
      KIBI_SWIPL: system
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache system SWI-Prolog source prefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8

      - name: Install system SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build CLI package
        run: bun run build:cli-stack

      # Exercises the PATH route end to end: doctor must report the system
      # install, and the repository's own KB must compile and check on it.
      # The checkout has no branch store yet (stores are per branch and never
      # committed), so sync compiles it first; without that, check reports
      # branch-store-not-compiled whenever the checkout is on a named branch,
      # as it is on a push to develop or master. A pull request checks out a
      # detached merge ref, where sync refuses to pick a branch, so the branch
      # is named explicitly for both commands. The check must report zero
      # findings of any severity, info included: Kibi's own KB is the
      # reference other projects are measured against.
      - name: Run Kibi on the system SWI-Prolog
        env:
          KIBI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          bun packages/cli/bin/kibi doctor | tee "$RUNNER_TEMP/doctor.txt"
          grep -q "SWI-Prolog: .* from PATH" "$RUNNER_TEMP/doctor.txt"
          bun packages/cli/bin/kibi sync
          sh scripts/kb-zero-findings.sh

  ci-package-contract:
    needs: [reuse]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build packages required for packing
        run: bun run build

      - name: Clean stale tarballs
        run: bun run clean:tarballs

      - name: Pack tarballs
        run: bun run scripts/pack-packages.ts --slice ci-pack

      - name: Upload tarball artifacts
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-tarballs
          path: packages/*/*.tgz
          retention-days: 1

      - name: Typecheck and compile e2e tests
        run: |
          bun run compile:e2e:packed
        env:
          KIBI_E2E_COMPILED_DIR: ${{ runner.temp }}/kibi-e2e-packed-compiled

      - name: Upload compiled e2e tests
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
          retention-days: 1

      - name: Verify publish metadata for npm provenance
        run: bun run scripts/verify-publish-metadata.ts

      - name: Check changed packages are bumped for release
        run: |
          git fetch --no-tags --depth=1 origin master
          bun run scripts/check-release-bumps.ts --base FETCH_HEAD

      - name: Verify the Kibi release manifest
        run: bun run release:check

      - name: Rehearse release decision with mock registry
        run: |
          PUBLISHED_TOKENS=$(bun scripts/package-catalog.ts --print-publishable-tsv | while IFS=$'\t' read -r dir _; do
            node -e "const fs=require('node:fs'); const j=JSON.parse(fs.readFileSync('packages/' + process.argv[1] + '/package.json','utf8')); process.stdout.write(j.name + '@' + j.version + ',');" "$dir"
          done | sed 's/,$//')
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="$PUBLISHED_TOKENS" \
            bun run scripts/run-release-state.ts > /tmp/release-state-all-published.json
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="" \
            bun run scripts/run-release-state.ts > /tmp/release-state-none-published.json
          bun -e "
            import { readFileSync } from 'node:fs';
            import { PUBLISHABLE_DIRS } from './scripts/package-catalog.ts';
            const allowed = new Set(['NOOP', 'PREPARE_RELEASE', 'PUBLISH_ONLY_RERUN', 'ALREADY_PUBLISHED_NOOP']);
            const canonical = new Set(PUBLISHABLE_DIRS);
            for (const [name, path] of [
              ['all-published', '/tmp/release-state-all-published.json'],
              ['none-published', '/tmp/release-state-none-published.json'],
            ]) {
              const d = JSON.parse(readFileSync(path, 'utf8'));
              if (!allowed.has(d.action)) {
                throw new Error(name + ': unexpected release action ' + d.action);
              }
              for (const entry of d.toPublish || []) {
                if (!canonical.has(entry.split('=')[0])) {
                  throw new Error(name + ': non-canonical toPublish entry ' + entry);
                }
              }
              console.log(name + ': action=' + d.action + ' toPublish=' + (d.toPublish || []).length);
            }
          "

      - name: Verify tarballs exist and are non-empty
        run: ls -lh packages/*/*.tgz

  packed-e2e-cli-regression:
    runs-on: ubuntu-latest
    needs: [reuse, ci-package-contract, prolog-unit-coverage]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && github.actor != 'nektos/act' && !inputs.skip_tests && needs.ci-package-contract.result == 'success' && needs.prolog-unit-coverage.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run CLI regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/cli-workflows.test.js" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/cli-query-regression.test.js"
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-mcp-regression:
    runs-on: ubuntu-latest
    needs: [reuse, ci-package-contract, prolog-unit-coverage]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && github.actor != 'nektos/act' && !inputs.skip_tests && needs.ci-package-contract.result == 'success' && needs.prolog-unit-coverage.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - name: Run MCP packed regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/mcp-protocol-regression.test.js" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/mcp-pnpm-upgrade-stale-path.test.js"
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-tarball-verify:
    runs-on: ubuntu-latest
    needs: [reuse, ci-package-contract, prolog-unit-coverage]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && github.actor != 'nektos/act' && !inputs.skip_tests && needs.ci-package-contract.result == 'success' && needs.prolog-unit-coverage.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run tarball verification
        run: |
          # These tarballs were built in ci-package-contract on another runner,
          # so the package build tree is unavailable to this consumer install.
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/cli-verify-tarball-core.test.js" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/runtime-symbol-analysis.test.js"
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5
      - name: Verify tarball path hygiene
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/packed-path-hygiene.test.js"
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5

  packed-e2e-branch-workflow:
    runs-on: ubuntu-latest
    needs: [reuse, ci-package-contract, prolog-unit-coverage]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && github.actor != 'nektos/act' && !inputs.skip_tests && needs.ci-package-contract.result == 'success' && needs.prolog-unit-coverage.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run branch workflow tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 "$RUNNER_TEMP/kibi-e2e-packed-compiled/branch-workflow.test.js"
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 15

  # Native Windows has no bundled SWI-Prolog; the install guide tells users to
  # install it from the SWI-Prolog installer and put swipl on PATH. This job
  # does exactly that, then runs the packed CLI and MCP server on it. It is
  # not a packed-e2e job: that harness assumes a POSIX shell and PATH.
  packed-e2e-windows-system-swipl:
    runs-on: windows-2025
    needs: [reuse, ci-package-contract, prolog-unit-coverage]
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && github.actor != 'nektos/act' && !inputs.skip_tests && needs.ci-package-contract.result == 'success' && needs.prolog-unit-coverage.result == 'success' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install SWI-Prolog with the Windows installer package
        run: |
          choco install swi-prolog --yes --no-progress
          for dir in "/c/Program Files/swipl/bin" "/c/Program Files/SWI-Prolog/bin"; do
            if [ -x "$dir/swipl.exe" ]; then
              cygpath -w "$dir" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "swipl.exe not found after install"
          exit 1
      - name: Show SWI-Prolog
        run: swipl --version
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Run Kibi on the system SWI-Prolog
        run: node scripts/system-swipl-smoke.mjs --tarballs packages
        timeout-minutes: 20

  prolog-unit-coverage:
    needs: [reuse, swipl-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && !inputs.skip_tests && needs.swipl-bundle.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl

      - name: Run Prolog unit coverage
        run: |
          for attempt in 1 2 3; do
            echo "Prolog coverage attempt $attempt/3..."
            rm -rf coverage/prolog
            if bun run test:coverage:prolog; then
              echo "Prolog coverage passed on attempt $attempt"
              exit 0
            fi
            echo "Prolog coverage failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Prolog coverage failed after 3 attempts"
          exit 1

      - name: Upload Prolog coverage artifact
        if: ${{ always() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prolog-coverage
          path: coverage/prolog
          if-no-files-found: error
          retention-days: 7

  # The Lean 4 proofs that intervals.pl's folds decide numeric satisfiability
  # and entailment exactly, and a differential run checking that intervals.pl
  # computes what the proved model computes (and agrees with CLP(Q)/CLP(FD)).
  lean-intervals-proof:
    needs: [reuse, swipl-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ always() && (needs.reuse.result == 'skipped' || needs.reuse.outputs.execute != 'false') && !inputs.skip_tests && needs.swipl-bundle.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl

      # The CLP(Q) oracle needs library(clpq), which the bundle does not ship.
      - name: Install the oracle SWI-Prolog
        run: bash scripts/ci-apt-bootstrap.sh swi-prolog-nox

      - name: Cache the Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('proof/lean/lean-toolchain') }}

      - name: Install the Lean toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl --fail --silent --show-error --location --output elan-init.sh \
              https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh
            echo "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264  elan-init.sh" | sha256sum --check
            sh elan-init.sh -y --default-toolchain none
            rm elan-init.sh
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the Lean proofs
        working-directory: proof/lean
        run: |
          lake build
          lake env lean CheckAxioms.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then
            echo "A theorem depends on sorry" >&2
            exit 1
          fi

      - name: Differential test against intervals.pl and CLP(Q)/CLP(FD)
        run: >-
          bun scripts/intervals-differential.ts
          --lean proof/lean/.lake/build/bin/kibi-intervals
          --oracle-swipl /usr/bin/swipl
          --require-oracle
          --cases 200000

  # The one CI check a ruleset requires. It needs every other job, runs even
  # when one fails or is skipped, and passes only when all of them succeeded.
  # The one exception is a recorded reuse: the reuse job proved this checkout's
  # git tree is the tree a member pull request already passed, and the other
  # jobs were skipped because of that. A skip for any other reason fails.
  ci-required:
    name: ci-required
    if: ${{ always() && github.actor != 'nektos/act' }}
    needs: [reuse, ci-typecheck-build, swipl-bundle, ci-unit-coverage, ci-unit-coverage-merge, ci-integration, ci-package-contract, packed-e2e-cli-regression, packed-e2e-mcp-regression, packed-e2e-tarball-verify, packed-e2e-branch-workflow, packed-e2e-windows-system-swipl, prolog-unit-coverage, lean-intervals-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXECUTE: ${{ needs.reuse.outputs.execute }}
      REUSE_RESULT: ${{ needs.reuse.result }}
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          execute="${EXECUTE:-true}"
          reuse_result="${REUSE_RESULT:-}"
          failed="$(jq -r --arg execute "$execute" --arg reuse_result "$reuse_result" '
            to_entries[]
            | .key as $k
            | .value.result as $r
            | if $r == "success" then empty
              elif $k == "reuse" and $r == "skipped" then empty
              elif $r == "skipped" and $execute == "false" and $reuse_result == "success" then empty
              else "\($k): \($r)"
              end
          ' <<<"$RESULTS")"
          if [ -n "$failed" ]; then
            echo "::error::These CI jobs did not succeed:"
            echo "$failed"
            exit 1
          fi

      # Records the git tree this run tested, so a later single-PR train can
      # reuse the result. A train that itself reused does not attest: it did
      # not test the tree.
      - name: Checkout the tested commit
        if: ${{ env.EXECUTE != 'false' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        if: ${{ env.EXECUTE != 'false' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Attest the tested tree
        if: ${{ env.EXECUTE != 'false' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        env:
          PR_HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          PR_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          KIBI_REUSE_WORKFLOW: .github/workflows/ci.yml
          KIBI_REUSE_ARTIFACT: kibi-ci-attestation
        run: |
          git rev-parse --verify HEAD
          bun scripts/ci-check-reuse.ts attest "$RUNNER_TEMP/kibi-ci-attestation"

      - name: Upload the tested-tree attestation
        if: ${{ env.EXECUTE != 'false' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-ci-attestation
          path: ${{ runner.temp }}/kibi-ci-attestation/attestation.json
          if-no-files-found: error
          retention-days: 7

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs (build still runs)'
        type: boolean
        default: false
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SWI-Prolog
        run: |
          sudo apt-get install -y software-properties-common
          if [ "${{ github.actor }}" != "nektos/act" ]; then
            sudo apt-add-repository -y ppa:swi-prolog/stable
          fi
          sudo apt-get update
          sudo apt-get install -y swi-prolog

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        env:
          NODE_INSTALLER: npm
      - name: Verify npm is available
        run: npm --version

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile
      - name: Build CLI package
        run: bun run build:cli

      - name: Build MCP package
        run: bun run build:mcp

      - name: Run unit tests with coverage
        if: ${{ !inputs.skip_tests && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: bun run test:coverage:unit

      - name: Run unit tests
        if: ${{ !inputs.skip_tests && !(github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
        run: bun run test:unit

      - name: Upload unit coverage artifact
        if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit coverage to Codecov
        if: ${{ !inputs.skip_tests && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/unit/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Run integration tests
        if: ${{ !inputs.skip_tests }}
        run: bash ./scripts/run-integration-tests.sh

      - name: Pack tarballs
        run: |
          cd packages/core && npm pack
          cd ../cli && npm pack
          cd ../mcp && npm pack

      - name: Upload tarball artifacts
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: kibi-tarballs
          path: packages/*/*.tgz
          retention-days: 1

      - name: Compile e2e tests
        run: |
          rm -rf /tmp/kibi-e2e-packed-compiled
          npx tsc -p documentation/tests/e2e/packed/tsconfig.e2e.json --outDir /tmp/kibi-e2e-packed-compiled --noEmitOnError false || true

      - name: Upload compiled e2e tests
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
          retention-days: 1

  packed-e2e-cli-regression:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install SWI-Prolog
        run: |
          sudo apt-get install -y software-properties-common
          if [ "${{ github.actor }}" != "nektos/act" ]; then
            sudo apt-add-repository -y ppa:swi-prolog/stable
          fi
          sudo apt-get update
          sudo apt-get install -y swi-prolog
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v4
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v4
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Run CLI regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/cli-workflows.test.js
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/cli-query-regression.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-mcp-regression:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install SWI-Prolog
        run: |
          sudo apt-get install -y software-properties-common
          if [ "${{ github.actor }}" != "nektos/act" ]; then
            sudo apt-add-repository -y ppa:swi-prolog/stable
          fi
          sudo apt-get update
          sudo apt-get install -y swi-prolog
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v4
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v4
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Run MCP protocol regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/mcp-protocol-regression.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-tarball-verify:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v4
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v4
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Run tarball verification
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/cli-verify-tarball-core.test.js
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5

  packed-e2e-branch-workflow:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install SWI-Prolog
        run: |
          sudo apt-get install -y software-properties-common
          if [ "${{ github.actor }}" != "nektos/act" ]; then
            sudo apt-add-repository -y ppa:swi-prolog/stable
          fi
          sudo apt-get update
          sudo apt-get install -y swi-prolog
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v4
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v4
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Run branch workflow tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/branch-workflow.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 15

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

      - name: Build MCP
        run: bun run build:mcp

      - name: Pack all packages
        run: |
          cd packages/core && npm pack
          cd ../cli && npm pack
          cd ../mcp && npm pack
          cd ../opencode && npm pack

      - name: Verify tarballs exist and are non-empty
        run: ls -lh packages/*/*.tgz

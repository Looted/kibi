name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs (build still runs)'
        type: boolean
        default: false
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
        env:
          NODE_INSTALLER: npm
      - name: Verify npm is available
        run: npm --version

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      - name: Typecheck matrix
        run: bun run typecheck

      - name: Build CLI package
        run: bun run build:cli

      - name: Build MCP package
        run: bun run build:mcp

      - name: Build Codex plugin package
        run: bun run build:codex

      - name: Build Cursor plugin package
        run: bun run build:cursor

      - name: Run unit tests with coverage
        if: ${{ !inputs.skip_tests }}
        run: bun run test:coverage:unit

      - name: Upload unit coverage artifact
        if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: |
            coverage/unit/lcov.info
            coverage/unit/source-manifest.txt
            coverage/unit/missing-source-files.txt
            coverage/unit/failed-shards.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit coverage to Codecov
        if: ${{ !inputs.skip_tests && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/unit/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-coverage
          fail_ci_if_error: true
          verbose: true

      - name: Run integration tests
        if: ${{ !inputs.skip_tests }}
        run: bash ./scripts/run-integration-tests.sh

      - name: Clean stale tarballs
        run: bun run clean:tarballs

      - name: Pack tarballs
        run: |
          cd packages/core && npm pack
          cd ../cli && npm pack
          cd ../runtime && npm pack
          cd ../mcp && npm pack
          cd ../opencode && npm pack
          cd ../codex && npm pack
          cd ../cursor && npm pack

      - name: Upload tarball artifacts
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v5
        with:
          name: kibi-tarballs
          path: packages/*/*.tgz
          retention-days: 1

      - name: Typecheck and compile e2e tests
        run: |
          bun run compile:e2e:packed

      - name: Upload compiled e2e tests
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
          retention-days: 1

  packed-e2e-cli-regression:
    runs-on: ubuntu-latest
    needs: [build-and-test, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Run CLI regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            /tmp/kibi-e2e-packed-compiled \
            /tmp/kibi-e2e-packed-compiled/cli-workflows.test.js \
            /tmp/kibi-e2e-packed-compiled/cli-query-regression.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-mcp-regression:
    runs-on: ubuntu-latest
    needs: [build-and-test, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - name: Run MCP packed regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            /tmp/kibi-e2e-packed-compiled \
            /tmp/kibi-e2e-packed-compiled/mcp-protocol-regression.test.js \
            /tmp/kibi-e2e-packed-compiled/mcp-pnpm-upgrade-stale-path.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-tarball-verify:
    runs-on: ubuntu-latest
    needs: [build-and-test, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Run tarball verification
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/cli-verify-tarball-core.test.js
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5
      - name: Verify tarball path hygiene
        run: |
          bun test --cwd documentation/tests/e2e/packed --timeout=300000 packed-path-hygiene.test.ts
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5

  packed-e2e-branch-workflow:
    runs-on: ubuntu-latest
    needs: [build-and-test, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: /tmp/kibi-e2e-packed-compiled
      - name: Run branch workflow tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 /tmp/kibi-e2e-packed-compiled/branch-workflow.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 15

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: [build-and-test, prolog-unit-coverage]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:cli

      - name: Build runtime
        run: bun run build:runtime

      - name: Build MCP
        run: bun run build:mcp

      - name: Pack all packages
        run: |
          cd packages/core && npm pack
          cd ../cli && npm pack
          cd ../runtime && npm pack
          cd ../mcp && npm pack
          cd ../opencode && npm pack
          cd ../codex && npm pack
          cd ../cursor && npm pack

      - name: Verify publish metadata for npm provenance
        run: bun run scripts/verify-publish-metadata.ts

      - name: Rehearse release decision with mock registry
        run: |
          PUBLISHED_TOKENS=$(node -e "
            const fs = require('node:fs');
            const dirs = ['core', 'runtime', 'cli', 'mcp', 'opencode', 'codex', 'cursor'];
            console.log(dirs.map((d) => {
              const j = JSON.parse(fs.readFileSync('packages/' + d + '/package.json', 'utf8'));
              return j.name + '@' + j.version;
            }).join(','));
          ")
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="$PUBLISHED_TOKENS" \
            bun run scripts/run-release-state.ts > /tmp/release-state-all-published.json
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="" \
            bun run scripts/run-release-state.ts > /tmp/release-state-none-published.json
          node -e "
            const fs = require('node:fs');
            const allowed = new Set(['NOOP', 'PREPARE_RELEASE', 'PUBLISH_ONLY_RERUN', 'ALREADY_PUBLISHED_NOOP']);
            const canonical = new Set(['core', 'runtime', 'cli', 'mcp', 'opencode', 'codex', 'cursor']);
            for (const [name, path] of [
              ['all-published', '/tmp/release-state-all-published.json'],
              ['none-published', '/tmp/release-state-none-published.json'],
            ]) {
              const d = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (!allowed.has(d.action)) {
                throw new Error(name + ': unexpected release action ' + d.action);
              }
              for (const entry of d.toPublish || []) {
                if (!canonical.has(entry.split('=')[0])) {
                  throw new Error(name + ': non-canonical toPublish entry ' + entry);
                }
              }
              console.log(name + ': action=' + d.action + ' toPublish=' + (d.toPublish || []).length);
            }
          "

      - name: Verify tarballs exist and are non-empty
        run: ls -lh packages/*/*.tgz

  prolog-unit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install SWI-Prolog
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Run Prolog unit coverage
        run: |
          for attempt in 1 2 3; do
            echo "Prolog coverage attempt $attempt/3..."
            rm -rf coverage/prolog
            if bun run test:coverage:prolog; then
              echo "Prolog coverage passed on attempt $attempt"
              exit 0
            fi
            echo "Prolog coverage failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Prolog coverage failed after 3 attempts"
          exit 1

      - name: Upload Prolog coverage artifact
        if: ${{ always() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v5
        with:
          name: prolog-coverage
          path: coverage/prolog
          if-no-files-found: error
          retention-days: 7

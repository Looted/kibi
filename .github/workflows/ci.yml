name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs (build still runs)'
        type: boolean
        default: false
        required: false

jobs:
  ci-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
        env:
          NODE_INSTALLER: npm
      - name: Verify npm is available
        run: npm --version

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      # Snyk's GitHub import cannot read bun.lock, so bun.lock is audited here.
      # Every ignore needs a reason; drop it once a fixed version ships.
      # GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 has no fixed release; kibi-cli only
      # expands glob patterns from the local project config, never remote input.
      - name: Audit JS dependencies
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

      - name: Check Codex hook bundle drift
        run: bun run --filter kibi-codex check:hook-bundle

      - name: Check Claude hook bundle drift
        run: bun run --filter kibi-claude check:hook-bundle

      - name: Verify generated symbol classification parity
        run: bun run symbols:check

      - name: Verify symbol classification generation and formatting are stable
        run: |
          bun run symbols:generate
          ./node_modules/.bin/biome format --write packages/cli/src/public/symbol-granularity.generated.ts
          bun run symbols:check
          git diff --exit-code -- packages/cli/src/public/symbol-granularity.generated.ts packages/core/src/symbol_classification.pl

      - name: Typecheck matrix
        run: bun run typecheck

      - name: Build packages
        run: bun run build

      - name: Verify approved source analyzer closure
        run: node scripts/qualify-source-analyzers.mjs

      - name: Test source analysis contracts and offline parsers
        run: |
          bun test ./packages/plugin-sdk/tests ./packages/plugin-builtin/tests
          bun run --cwd packages/plugin-treesitter test

  # Builds (or restores from cache) the linux-x64-gnu SWI-Prolog archive that
  # ships in kibi-swipl-linux-x64-gnu; every Prolog job except ci-integration
  # runs it. See .github/workflows/swipl-ci-bundle.yml.
  swipl-bundle:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/swipl-ci-bundle.yml

  # The unit suite runs as cost-balanced partitions in parallel jobs (see
  # partitionShards in scripts/run-unit-coverage.ts). Each partition publishes
  # its per-shard LCOV; ci-unit-coverage-merge combines them and applies the
  # repository coverage floor and source-manifest audit once.
  ci-unit-coverage:
    name: ci-unit-coverage (${{ matrix.partition }}/4)
    needs: [swipl-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ !inputs.skip_tests }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
        with:
          verify-resolver: 'true'

      - name: Build packages needed by unit coverage
        run: bun run build

      - name: Run unit tests with coverage
        run: bun run test:coverage:unit --partition=${{ matrix.partition }}/4

      - name: Upload partition shard coverage
        if: ${{ !cancelled() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage-partition-${{ matrix.partition }}
          path: |
            coverage/unit/lcov.*.info
            coverage/unit/results.*.json
            coverage/unit/failed-shards.txt
          if-no-files-found: error
          retention-days: 1
          # A re-run of a failed partition must replace the artifact its first
          # attempt uploaded; otherwise the merge job downloads the stale one
          # (with failed-shards.txt) and fails again on a green re-run.
          overwrite: true

  ci-unit-coverage-merge:
    name: ci-unit-coverage
    needs: [ci-unit-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs even when a partition fails so this check reports the failure
    # instead of showing as skipped.
    if: ${{ !cancelled() && !inputs.skip_tests && github.actor != 'nektos/act' }}
    steps:
      - name: Require every partition to pass
        if: ${{ needs.ci-unit-coverage.result != 'success' }}
        run: |
          echo "::error::Unit coverage partitions finished with '${{ needs.ci-unit-coverage.result }}'."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Download partition shard coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-coverage-partition-*
          # Outside coverage/ so Codecov's file search does not upload the
          # per-partition copies alongside the merged report.
          path: ${{ runner.temp }}/unit-coverage-partitions

      - name: Merge unit coverage and enforce repository gates
        run: bun run test:coverage:unit --merge="$RUNNER_TEMP/unit-coverage-partitions"

      # Per-file results bound to this commit. The proof workflow for the same
      # commit reuses clean files instead of running them a second time.
      - name: Upload unit test results
        if: ${{ !cancelled() && hashFiles('coverage/unit/test-results.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: coverage/unit/test-results.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload unit coverage artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: |
            coverage/unit/lcov.info
            coverage/unit/coverage-summary.txt
            coverage/unit/source-manifest.txt
            coverage/unit/missing-source-files.txt
            coverage/unit/failed-shards.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit coverage to Codecov
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Install the official CLI from PyPI while the binary CDN fails TLS.
          use_pypi: true
          files: ./coverage/unit/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-coverage
          fail_ci_if_error: true
          verbose: true

  ci-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ !inputs.skip_tests }}
    # The one job that keeps testing a system SWI-Prolog: installed by
    # scripts/ci-install-swi-prolog.sh, found on PATH, and selected explicitly
    # with KIBI_SWIPL=system so the bundle can never be used here. Every other
    # Prolog job runs the pipeline-built bundle that ships to users.
    env:
      KIBI_SWIPL: system
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache system SWI-Prolog source prefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8

      - name: Install system SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build CLI package
        run: bun run build:cli-stack

      # Exercises the PATH route end to end: doctor must report the system
      # install, and the repository's own KB must compile and check on it.
      # The checkout has no branch store yet (stores are per branch and never
      # committed), so sync compiles it first; without that, check reports
      # branch-store-not-compiled whenever the checkout is on a named branch,
      # as it is on a push to develop or master. A pull request checks out a
      # detached merge ref, where sync refuses to pick a branch, so the branch
      # is named explicitly for both commands. kibi verify then certifies the
      # KB theorems and re-checks every certificate with the independent
      # checker; a rejected certificate or a disproved theorem fails the job.
      - name: Run Kibi on the system SWI-Prolog
        env:
          KIBI_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          bun packages/cli/bin/kibi doctor | tee "$RUNNER_TEMP/doctor.txt"
          grep -q "SWI-Prolog: .* from PATH" "$RUNNER_TEMP/doctor.txt"
          bun packages/cli/bin/kibi sync
          bun packages/cli/bin/kibi check
          bun packages/cli/bin/kibi verify

  ci-package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build packages required for packing
        run: bun run build

      - name: Clean stale tarballs
        run: bun run clean:tarballs

      - name: Pack tarballs
        run: bun run scripts/pack-packages.ts --slice ci-pack

      - name: Upload tarball artifacts
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-tarballs
          path: packages/*/*.tgz
          retention-days: 1

      - name: Typecheck and compile e2e tests
        run: |
          bun run compile:e2e:packed
        env:
          KIBI_E2E_COMPILED_DIR: ${{ runner.temp }}/kibi-e2e-packed-compiled

      - name: Upload compiled e2e tests
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
          retention-days: 1

      - name: Verify publish metadata for npm provenance
        run: bun run scripts/verify-publish-metadata.ts

      - name: Rehearse release decision with mock registry
        run: |
          PUBLISHED_TOKENS=$(bun scripts/package-catalog.ts --print-publishable-tsv | while IFS=$'\t' read -r dir _; do
            node -e "const fs=require('node:fs'); const j=JSON.parse(fs.readFileSync('packages/' + process.argv[1] + '/package.json','utf8')); process.stdout.write(j.name + '@' + j.version + ',');" "$dir"
          done | sed 's/,$//')
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="$PUBLISHED_TOKENS" \
            bun run scripts/run-release-state.ts > /tmp/release-state-all-published.json
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="" \
            bun run scripts/run-release-state.ts > /tmp/release-state-none-published.json
          bun -e "
            import { readFileSync } from 'node:fs';
            import { PUBLISHABLE_DIRS } from './scripts/package-catalog.ts';
            const allowed = new Set(['NOOP', 'PREPARE_RELEASE', 'PUBLISH_ONLY_RERUN', 'ALREADY_PUBLISHED_NOOP']);
            const canonical = new Set(PUBLISHABLE_DIRS);
            for (const [name, path] of [
              ['all-published', '/tmp/release-state-all-published.json'],
              ['none-published', '/tmp/release-state-none-published.json'],
            ]) {
              const d = JSON.parse(readFileSync(path, 'utf8'));
              if (!allowed.has(d.action)) {
                throw new Error(name + ': unexpected release action ' + d.action);
              }
              for (const entry of d.toPublish || []) {
                if (!canonical.has(entry.split('=')[0])) {
                  throw new Error(name + ': non-canonical toPublish entry ' + entry);
                }
              }
              console.log(name + ': action=' + d.action + ' toPublish=' + (d.toPublish || []).length);
            }
          "

      - name: Verify tarballs exist and are non-empty
        run: ls -lh packages/*/*.tgz

  packed-e2e-cli-regression:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run CLI regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/cli-workflows.test.js" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/cli-query-regression.test.js"
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-mcp-regression:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - name: Run MCP packed regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/mcp-protocol-regression.test.js" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/mcp-pnpm-upgrade-stale-path.test.js"
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-tarball-verify:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run tarball verification
        run: |
          # These tarballs were built in ci-package-contract on another runner,
          # so the package build tree is unavailable to this consumer install.
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/cli-verify-tarball-core.test.js" \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/runtime-symbol-analysis.test.js"
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5
      - name: Verify tarball path hygiene
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 \
            "$RUNNER_TEMP/kibi-e2e-packed-compiled/packed-path-hygiene.test.js"
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5

  packed-e2e-branch-workflow:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl
      - name: Download tarball artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run branch workflow tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 "$RUNNER_TEMP/kibi-e2e-packed-compiled/branch-workflow.test.js"
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 15

  prolog-unit-coverage:
    needs: [swipl-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Use the pipeline-built SWI-Prolog
        uses: ./.github/actions/use-bundled-swipl

      - name: Run Prolog unit coverage
        run: |
          for attempt in 1 2 3; do
            echo "Prolog coverage attempt $attempt/3..."
            rm -rf coverage/prolog
            if bun run test:coverage:prolog; then
              echo "Prolog coverage passed on attempt $attempt"
              exit 0
            fi
            echo "Prolog coverage failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Prolog coverage failed after 3 attempts"
          exit 1

      - name: Upload Prolog coverage artifact
        if: ${{ always() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prolog-coverage
          path: coverage/prolog
          if-no-files-found: error
          retention-days: 7

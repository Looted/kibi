name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test jobs (build still runs)'
        type: boolean
        default: false
        required: false

jobs:
  ci-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
        env:
          NODE_INSTALLER: npm
      - name: Verify npm is available
        run: npm --version

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      - name: Check Codex hook bundle drift
        run: bun run --filter kibi-codex check:hook-bundle

      - name: Typecheck matrix
        run: bun run typecheck

      - name: Build packages
        run: bun run build

  ci-unit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache SWI-Prolog source prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8

      - name: Install SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup SkillOpt Python environment
        env:
          UV_VERSION: "0.9.26"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project tools/skillopt --frozen

      - name: Install JS deps
        run: |
          bun install --frozen-lockfile
          cd .opencode && bun install --frozen-lockfile

      - name: Build packages needed by unit coverage
        run: bun run build

      - name: Run unit tests with coverage
        run: bun run test:coverage:unit

      - name: Upload unit coverage artifact
        if: ${{ github.actor != 'nektos/act' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: |
            coverage/unit/lcov.info
            coverage/unit/coverage-summary.txt
            coverage/unit/source-manifest.txt
            coverage/unit/missing-source-files.txt
            coverage/unit/failed-shards.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit coverage to Codecov
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/unit/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          name: unit-coverage
          fail_ci_if_error: true
          verbose: true

  ci-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache SWI-Prolog source prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8

      - name: Install SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build CLI package
        run: bun run build:cli-stack

      - name: Run integration tests
        run: bash ./scripts/run-integration-tests.sh

  ci-package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build packages required for packing
        run: bun run build

      - name: Clean stale tarballs
        run: bun run clean:tarballs

      - name: Pack tarballs
        run: bun run scripts/pack-packages.ts --slice ci-pack

      - name: Upload tarball artifacts
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v5
        with:
          name: kibi-tarballs
          path: packages/*/*.tgz
          retention-days: 1

      - name: Typecheck and compile e2e tests
        run: |
          bun run compile:e2e:packed
        env:
          KIBI_E2E_COMPILED_DIR: ${{ runner.temp }}/kibi-e2e-packed-compiled

      - name: Upload compiled e2e tests
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
          retention-days: 1

      - name: Verify publish metadata for npm provenance
        run: bun run scripts/verify-publish-metadata.ts

      - name: Rehearse release decision with mock registry
        run: |
          PUBLISHED_TOKENS=$(bun scripts/package-catalog.ts --print-publishable-tsv | while IFS=$'\t' read -r dir name; do
            node -e "const fs=require('node:fs'); const j=JSON.parse(fs.readFileSync('packages/' + process.argv[1] + '/package.json','utf8')); process.stdout.write(j.name + '@' + j.version + ',');" "$dir"
          done | sed 's/,$//')
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="$PUBLISHED_TOKENS" \
            bun run scripts/run-release-state.ts > /tmp/release-state-all-published.json
          GITHUB_REF_NAME=master KIBI_RELEASE_MOCK_NPM="" \
            bun run scripts/run-release-state.ts > /tmp/release-state-none-published.json
          bun -e "
            import { readFileSync } from 'node:fs';
            import { PUBLISHABLE_DIRS } from './scripts/package-catalog.ts';
            const allowed = new Set(['NOOP', 'PREPARE_RELEASE', 'PUBLISH_ONLY_RERUN', 'ALREADY_PUBLISHED_NOOP']);
            const canonical = new Set(PUBLISHABLE_DIRS);
            for (const [name, path] of [
              ['all-published', '/tmp/release-state-all-published.json'],
              ['none-published', '/tmp/release-state-none-published.json'],
            ]) {
              const d = JSON.parse(readFileSync(path, 'utf8'));
              if (!allowed.has(d.action)) {
                throw new Error(name + ': unexpected release action ' + d.action);
              }
              for (const entry of d.toPublish || []) {
                if (!canonical.has(entry.split('=')[0])) {
                  throw new Error(name + ': non-canonical toPublish entry ' + entry);
                }
              }
              console.log(name + ': action=' + d.action + ' toPublish=' + (d.toPublish || []).length);
            }
          "

      - name: Verify tarballs exist and are non-empty
        run: ls -lh packages/*/*.tgz

  packed-e2e-cli-regression:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Cache SWI-Prolog source prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8
      - name: Install SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run CLI regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            $RUNNER_TEMP/kibi-e2e-packed-compiled \
            $RUNNER_TEMP/kibi-e2e-packed-compiled/cli-workflows.test.js \
            $RUNNER_TEMP/kibi-e2e-packed-compiled/cli-query-regression.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-mcp-regression:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Cache SWI-Prolog source prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8
      - name: Install SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
      - name: Run MCP packed regression tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node scripts/run-packed-e2e.mjs \
            $RUNNER_TEMP/kibi-e2e-packed-compiled \
            $RUNNER_TEMP/kibi-e2e-packed-compiled/mcp-protocol-regression.test.js \
            $RUNNER_TEMP/kibi-e2e-packed-compiled/mcp-pnpm-upgrade-stale-path.test.js
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 10

  packed-e2e-tarball-verify:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run tarball verification
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 "$RUNNER_TEMP/kibi-e2e-packed-compiled/cli-verify-tarball-core.test.js"
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5
      - name: Verify tarball path hygiene
        run: |
          bun test --cwd documentation/tests/e2e/packed --timeout=300000 packed-path-hygiene.test.ts
        env:
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 5

  packed-e2e-branch-workflow:
    runs-on: ubuntu-latest
    needs: [ci-package-contract, prolog-unit-coverage]
    if: ${{ github.actor != 'nektos/act' && !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Cache SWI-Prolog source prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8
      - name: Install SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download tarball artifacts
        uses: actions/download-artifact@v5
        with:
          name: kibi-tarballs
          path: packages
      - name: Download compiled e2e tests
        uses: actions/download-artifact@v5
        with:
          name: kibi-e2e-tests-compiled
          path: ${{ runner.temp }}/kibi-e2e-packed-compiled
      - name: Run branch workflow tests
        run: |
          NODE_OPTIONS='--enable-source-maps' node --test --test-concurrency=1 "$RUNNER_TEMP/kibi-e2e-packed-compiled/branch-workflow.test.js"
        env:
          KIBI_E2E_ALLOW_PATCHED_INSTALL: "0"
          KIBI_TEST_TARBALLS: ${{ github.workspace }}/packages
        timeout-minutes: 15

  prolog-unit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache SWI-Prolog source prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8

      - name: Install SWI-Prolog
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Run Prolog unit coverage
        run: |
          for attempt in 1 2 3; do
            echo "Prolog coverage attempt $attempt/3..."
            rm -rf coverage/prolog
            if bun run test:coverage:prolog; then
              echo "Prolog coverage passed on attempt $attempt"
              exit 0
            fi
            echo "Prolog coverage failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Prolog coverage failed after 3 attempts"
          exit 1

      - name: Upload Prolog coverage artifact
        if: ${{ always() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v5
        with:
          name: prolog-coverage
          path: coverage/prolog
          if-no-files-found: error
          retention-days: 7

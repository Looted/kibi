name: Kibi strict requirement proof

concurrency:
  group: kibi-proof-${{ github.ref }}
  # A develop proof run writes snapshot-bound receipts for every contract and
  # the attestation master PRs reuse, so let it finish instead of cancelling
  # it when another develop commit arrives. A pull request run proves only its
  # head; a newer push supersedes it, so the stale run is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Kibi's own CI never sends anonymous usage telemetry.
  KIBI_TELEMETRY: "0"
  KIBI_CLI: ./packages/cli/bin/kibi
  # The intervals differential must run its CLP(Q)/CLP(FD) oracle here.
  KIBI_REQUIRE_ORACLE: "1"
  KIBI_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' && 'master' || github.head_ref || github.ref_name }}

jobs:
  swipl-bundle:
    name: Bundled SWI-Prolog
    uses: ./.github/workflows/swipl-ci-bundle.yml

  proof:
    name: Contracted proof and health report
    needs: [swipl-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.7.0"

      - name: Install dependencies for canonical snapshot
        run: bun install --frozen-lockfile

      # A master PR from develop reuses develop's proof of its head. A PR into
      # develop reuses develop's proof of its base when the merge leaves the
      # Kibi proof snapshot unchanged (it excludes docs/ and .changeset/).
      - name: Check whether the PR can reuse develop proof
        id: reuse
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && ((github.base_ref == 'master' && github.head_ref == 'develop') || github.base_ref == 'develop') }}
        continue-on-error: true
        # Waits for develop's own proof of that commit (a master PR's head is
        # usually still proving) instead of re-proving it; falls back to full
        # proof after the budget.
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
          KIBI_PROOF_REUSE_WAIT_SECONDS: ${{ github.base_ref == 'master' && '3600' || '900' }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci-proof-reuse.ts decide "$RUNNER_TEMP/kibi-proof-decision.json"

      - name: Upload proof reuse decision
        if: ${{ github.event_name == 'pull_request' && steps.reuse.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-proof-reuse-decision
          path: ${{ runner.temp }}/kibi-proof-decision.json
          if-no-files-found: error
          retention-days: 7

      - name: Bootstrap Ubuntu packages
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bash scripts/ci-apt-bootstrap.sh bubblewrap z3 swi-prolog-nox

      # The pipeline-built bundle (kibi-swipl-linux-x64-gnu's archive), so the
      # proof runs on the same Prolog bytes that ship. Kept under this name for
      # scripts/replay-proof-ci.ts, which lists it as host provisioning.
      - name: Install SWI-Prolog
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        uses: ./.github/actions/use-bundled-swipl
        with:
          verify-resolver: 'true'

      - name: Provision strict-proof host prerequisites
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        env:
          UV_VERSION: "0.9.26"
          CODEX_CLI_VERSION: "0.144.6"
          # Same pnpm as ci.yml's packed MCP job; the newest pnpm fails the
          # offline upgrade in mcp-pnpm-upgrade-stale-path.test.ts.
          PNPM_VERSION: "10.24.0"
          ELAN_VERSION: "v4.1.2"
          ELAN_INIT_SHA256: "4bacca9502cb89736fe63d2685abc2947cfbf34dc87673504f1bb4c43eda9264"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --global "@openai/codex@${CODEX_CLI_VERSION}"
          npm install --global "pnpm@${PNPM_VERSION}"
          # Lean for the intervals.pl proofs. The proof step runs `lake --dir
          # proof/lean` from the repository root, where no lean-toolchain file
          # applies, so proof/lean's toolchain is also the default.
          curl --fail --silent --show-error --location --output elan-init.sh \
            "https://raw.githubusercontent.com/leanprover/elan/${ELAN_VERSION}/elan-init.sh"
          echo "${ELAN_INIT_SHA256}  elan-init.sh" | sha256sum --check
          sh elan-init.sh -y --default-toolchain "$(cat proof/lean/lean-toolchain)"
          rm elan-init.sh
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          uv --version
          codex --version
          test "$(pnpm --version)" = "$PNPM_VERSION"
          bwrap --version
          z3 --version
          /usr/bin/swipl -g "use_module(library(clpq))" -t halt
          lake --version
          uv sync --project tools/skillopt --frozen
          uv run --project tools/skillopt python tools/skillopt/verify_pin.py

      - name: Install proof-only dependencies
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: cd .opencode && bun install --frozen-lockfile

      - name: Build packages used by packed proof contracts
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun run build

      - name: Reject generated manifest drift in committed snapshot
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun packages/cli/bin/kibi check-generated --staged

      - name: Compile packed proof tests
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun run compile:e2e:packed

      - name: Sync and validate integrity of the proof snapshot
        id: integrity
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: |
          bun packages/cli/bin/kibi sync --refresh-symbol-coordinates
          if ! git diff --quiet -- .kb/symbols.yaml; then
            echo '::error::Kibi rewrote .kb/symbols.yaml during sync. Run kibi sync --refresh-symbol-coordinates and commit the reviewed manifest changes.'
            exit 1
          fi
          bun packages/cli/bin/kibi check --format json --rules no-dangling-refs,source-relationship-parity,no-cycles,required-fields,deprecated-adr-no-successor,domain-contradictions,query-plan-safety,logic-coverage,strict-fact-shape,strict-req-fact-pairing,predicate-verifiability,rule-safety,rule-verifiability,semantic-completeness,symbol-traceability

      # Every current requirement's floor, before re-proving: receipts that
      # are only older than the code count as pending re-proof, so grounding,
      # contradiction and link regressions fail before the long proof run.
      - name: Reject evidence-floor regressions before executing contracts
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: sh scripts/proof-gate.sh

      - name: Prove every contracted test through Kibi
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        env:
          # Distinct proof commands run three at a time on the 4-vCPU runner; at four,
          # CPU contention made every step slower and the whole run longer.
          # Every declared step is recorded per contract.
          KIBI_PROOF_STEP_CONCURRENCY: "3"
          # A `bun test` step made only of whole test files reuses the per-file
          # results the CI unit run published for this same commit, or a pass
          # of the same files earlier in this run, instead of running again.
          # The fetcher writes either the results or why they are unavailable.
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          results="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/kibi-unit-test-results.json"
          rm -f "$results"
          bun scripts/ci-unit-results.ts fetch "$results" &
          fetcher=$!
          status=0
          KIBI_PROOF_UNIT_RESULTS="$results" bun packages/cli/bin/kibi prove --all || status=$?
          kill "$fetcher" 2>/dev/null || true
          exit "$status"

      # Also saves the kb-consistency certificates the gate re-checked, so an
      # independent checker re-checks them and the report publishes them.
      - name: Enforce evidence floors on a clean snapshot
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: sh scripts/proof-gate.sh --fresh-evidence --write-certificates "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/kb-certificates.json"

      - name: Re-check KB certificates with the independent checker
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun packages/cli/bin/kibi check --certificates "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/kb-certificates.json"

      # Asks the repository's own KB the versioned gold questions through the
      # built CLI and fails on recall@3, superseded results, abstention or warm
      # latency below the committed thresholds.
      - name: Gate kb_search answers on the repository gold set
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: >-
          bun run scripts/change-to-proof-eval.ts --repo-kb
          documentation/evaluations/change-to-proof/repo-search-gold.v2.jsonl
          --thresholds documentation/evaluations/change-to-proof/repo-search-thresholds.json

      # Reworded questions the lexical ranker misses: with the repository's
      # search-hints plugin active, the expected requirement must be in the
      # top three or among the hints.
      - name: Gate kb_search hints on reworded questions
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: >-
          bun run scripts/change-to-proof-eval.ts --repo-kb
          documentation/evaluations/change-to-proof/repo-search-hints-gold.v1.jsonl
          --thresholds documentation/evaluations/change-to-proof/repo-search-hints-thresholds.json

      - name: Generate requirement health report
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: |
          certificates="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/kb-certificates.json"
          if [ -f "$certificates" ]; then
            bun packages/cli/bin/kibi report --output kibi-report --certificates "$certificates"
          else
            bun packages/cli/bin/kibi report --output kibi-report
          fi

      - name: Upload Kibi proof artifacts
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-requirement-proof
          path: |
            kibi-report
            proof
          if-no-files-found: error
          retention-days: 7

      - name: Attest successful develop proof
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: bun scripts/ci-proof-reuse.ts attest "$RUNNER_TEMP/kibi-proof-attestation"

      - name: Upload develop proof attestation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibi-proof-attestation
          path: ${{ runner.temp }}/kibi-proof-attestation/attestation.json
          if-no-files-found: error
          retention-days: 7

      - name: Build documentation site at the Pages root
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !cancelled() && steps.integrity.outcome == 'success' }}
        env:
          KIBI_UMAMI_WEBSITE_ID: 197fb489-cdd4-4d95-ae8a-119dc6422a45
        run: bun run docs:site -- --out pages

      - name: Namespace the proof report under /kibi-report/
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !cancelled() && steps.integrity.outcome == 'success' }}
        run: |
          mkdir -p pages/kibi-report
          cp -R kibi-report/. pages/kibi-report/

      - name: Upload Kibi Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !cancelled() && steps.integrity.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages

  deploy:
    name: Deploy proof report and documentation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: proof
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy proof report and documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

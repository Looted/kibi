name: Kibi strict requirement proof

concurrency:
  group: kibi-proof-${{ github.ref }}
  # A proof run writes snapshot-bound receipts for every contract. Let a run
  # finish instead of cancelling it when another develop commit arrives.
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KIBI_CLI: ./packages/cli/bin/kibi
  KIBI_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' && 'master' || github.head_ref || github.ref_name }}

jobs:
  proof:
    name: Contracted proof and health report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26.7.0"

      - name: Install dependencies for canonical snapshot
        run: bun install --frozen-lockfile

      - name: Check whether master PR can reuse develop proof
        id: reuse
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci-proof-reuse.ts decide "$RUNNER_TEMP/kibi-proof-decision.json"

      - name: Upload proof reuse decision
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' && steps.reuse.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: kibi-proof-reuse-decision
          path: ${{ runner.temp }}/kibi-proof-decision.json
          if-no-files-found: error
          retention-days: 7

      - name: Bootstrap Ubuntu packages
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bash scripts/ci-apt-bootstrap.sh bubblewrap

      - name: Cache SWI-Prolog source prefix
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kibi-swipl-prefix
          key: swipl-src-10.0.2-${{ runner.os }}-e42cc098f7b8

      - name: Install SWI-Prolog
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        env:
          KIBI_SWIPL_CACHE_DIR: ${{ runner.temp }}/kibi-swipl-prefix
        run: bash scripts/ci-install-swi-prolog.sh

      - name: Provision strict-proof host prerequisites
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        env:
          UV_VERSION: "0.9.26"
          CODEX_CLI_VERSION: "0.144.6"
        run: |
          curl --fail --silent --show-error --location \
            "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --global "@openai/codex@${CODEX_CLI_VERSION}"
          uv --version
          codex --version
          bwrap --version
          uv sync --project tools/skillopt --frozen
          uv run --project tools/skillopt python tools/skillopt/verify_pin.py

      - name: Install proof-only dependencies
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: cd .opencode && bun install --frozen-lockfile

      - name: Build packages used by packed proof contracts
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun run build

      - name: Reject generated manifest drift in committed snapshot
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun packages/cli/bin/kibi check-generated --staged

      - name: Compile packed proof tests
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun run compile:e2e:packed

      - name: Sync and validate integrity of the proof snapshot
        id: integrity
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: |
          bun packages/cli/bin/kibi sync --refresh-symbol-coordinates
          if ! git diff --quiet -- .kb/symbols.yaml .kb/symbol-coordinates.yaml; then
            echo '::error::Kibi generated manifests changed during sync. Run kibi sync --refresh-symbol-coordinates and commit the reviewed manifest changes.'
            exit 1
          fi
          bun packages/cli/bin/kibi check --format json --rules no-dangling-refs,source-relationship-parity,no-cycles,required-fields,deprecated-adr-no-successor,domain-contradictions,query-plan-safety,logic-coverage,strict-fact-shape,strict-req-fact-pairing,predicate-verifiability,rule-safety,rule-verifiability,semantic-completeness,symbol-traceability

      - name: Prove every contracted test through Kibi
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun packages/cli/bin/kibi prove --all

      - name: Enforce proof baseline and clean snapshot
        if: ${{ (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: node scripts/check-proof-baseline.mjs

      - name: Generate requirement health report
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        run: bun packages/cli/bin/kibi report --output kibi-report

      - name: Upload Kibi proof artifacts
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && (steps.reuse.outcome != 'success' || steps.reuse.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@v5
        with:
          name: kibi-requirement-proof
          path: |
            kibi-report
            proof
          if-no-files-found: error
          retention-days: 7

      - name: Attest successful develop proof
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: bun scripts/ci-proof-reuse.ts attest "$RUNNER_TEMP/kibi-proof-attestation"

      - name: Upload develop proof attestation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/upload-artifact@v5
        with:
          name: kibi-proof-attestation
          path: ${{ runner.temp }}/kibi-proof-attestation/attestation.json
          if-no-files-found: error
          retention-days: 7

      - name: Namespace Pages output under /kibi-report/
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !cancelled() && steps.integrity.outcome == 'success' }}
        run: |
          mkdir -p pages/kibi-report
          cp -R kibi-report/. pages/kibi-report/

      - name: Upload Kibi Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && !cancelled() && steps.integrity.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    name: Deploy Kibi proof report
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: proof
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy proof report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

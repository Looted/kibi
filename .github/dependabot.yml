version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Must match engines.vscode, or vsce refuses to package the extension.
      - dependency-name: "@types/vscode"
      # Pinned to the qualified tree-sitter runtime catalog; bumping needs re-qualification.
      - dependency-name: "web-tree-sitter"
    groups:
      bun-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

# Kibi context hooks for Mistral Vibe (plugin scope).
#
# Plugin hooks run in the plugin's read-only copy with PLUGIN_ROOT set; the
# session folder arrives as `cwd` in the JSON payload on stdin. Each script
# calls the kibi CLI through bin/kibi.mjs, which spawns the project-local kibi
# directly (natively on Windows too, with the bundled SWI-Prolog) and wraps the
# call in WSL only for a \\wsl.localhost\<distro> workspace or KIBI_FORCE_WSL=1.
# All hooks fail open: on any error they exit 0 with no output and print
# nothing to stderr unless KIBI_VIBE_LAUNCHER_DEBUG=1 is set.

[[hooks]]
name = "kibi-session-context"
type = "session_start"
match = "re:startup|resume"
command = "node bin/hooks/kibi-session-context.mjs"
timeout = 45.0
description = "Summarize the attached Kibi KB (branch, freshness) at session start"

[[hooks]]
name = "kibi-prompt-context"
type = "pre_agent"
command = "node bin/hooks/kibi-prompt-context.mjs"
timeout = 45.0
description = "Search the Kibi KB for the prompt and inject governing entities"

[[hooks]]
name = "kibi-file-context"
type = "post_tool"
match = "re:(file_system\\.)?(read_file|grep|bash|edit|write_file|search_replace)|(?:mcp_[^.]*kibi[^.]*\\.(?:kibi_)?|[A-Za-z0-9-]+_)?kb_(?:upsert|record|delete|apply_plan)"
command = "node bin/hooks/kibi-file-context.mjs"
timeout = 30.0
description = "After a read, search or shell read, append requirement rows for the code in view; after an edit, the Kibi entities linked to the file; after an edit or kb_upsert, flag a level change or lowered required_evidence"

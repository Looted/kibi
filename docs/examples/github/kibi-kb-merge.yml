# Kibi KB merge: keep pull requests mergeable when only Kibi manifests conflict.
#
# Copy this file to .github/workflows/kibi-kb-merge.yml. Setup, tokens and
# limits: https://github.com/Looted/kibi/blob/develop/docs/github-integration.md#keep-pull-requests-mergeable-in-ci
#
# When the default branch moves, open pull requests often stop merging only
# because both sides appended records to .kb/symbols.yaml (or to a
# .kb/relationships shard). GitHub's merge check never runs a custom merge
# driver, so this workflow does: it test-merges each open same-repository pull
# request, and when the only conflicts are Kibi manifests it merges the
# default branch into the PR branch with `kibi merge-driver`, runs `kibi sync`
# and `kibi check` on the merged tree, and pushes the merge commit. Any other
# conflict, or two sides changing the same field of one record, is left for a
# person. Fork pull requests are skipped: the workflow cannot push to them.
#
# It runs when the default branch moves (every open pull request) and when any
# other branch is pushed (that branch's pull request only). GitHub does not
# start pull_request workflows while a pull request has conflicts, so push is
# the trigger.
#
# Token: pushes made with the default GITHUB_TOKEN do not start other
# workflows, so the PR's checks would not re-run on the merge commit. Add a
# repository secret KIBI_MERGE_TOKEN (a fine-grained personal access token or
# GitHub App token limited to this repository, with Contents and Workflows
# read/write) so they do. An expired secret fails the job; it does not fall
# back to GITHUB_TOKEN.
#
# Package manager: this example uses npm (`cache: npm` and `npm ci`). For
# pnpm, Yarn, or Bun, change those two steps and keep the `kibi` input pointing
# at the installed binary.
#
# Version: pin the action to a full commit SHA of Looted/kibi (shown here as
# master). Any kibi-cli version with `kibi merge-driver` works with it.

name: Kibi KB merge

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kibi-kb-merge-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  kb-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # Kibi comes from the default branch, not the PR branch: a branch that
      # predates the merge driver has no `kibi merge-driver`, and its own
      # lockfile may be stale until the default branch is merged in. The PR
      # branches are merged in scratch worktrees of this checkout, and its
      # credentials push the merges.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.KIBI_MERGE_TOKEN || github.token }}

      # Cheap first pass: list the pull requests that conflict only in Kibi
      # manifests, so nothing is installed when there is nothing to merge.
      - name: Find pull requests blocked only by Kibi manifests
        id: find
        uses: Looted/kibi/actions/kb-merge@master
        with:
          branches: ${{ github.ref_name != github.event.repository.default_branch && github.ref_name || '' }}
          list-only: "true"

      - uses: actions/setup-node@v5
        if: ${{ steps.find.outputs.branches != '[]' }}
        with:
          node-version: 24
          cache: npm

      - if: ${{ steps.find.outputs.branches != '[]' }}
        run: npm ci

      - name: Merge the default branch with the Kibi merge driver
        if: ${{ steps.find.outputs.branches != '[]' }}
        uses: Looted/kibi/actions/kb-merge@master
        with:
          branches: ${{ steps.find.outputs.branches }}
          kibi: node_modules/.bin/kibi
          # Runs in the merged tree before the push; the merge is pushed only
          # when it passes. Use your own gate here, or "" for none.
          check: $KIBI check

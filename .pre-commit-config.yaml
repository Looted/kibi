repos:
  - repo: local
    hooks:
      - id: kibi-traceability
        name: Kibi Staged Traceability Check
        entry: scripts/traceability-check.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: kibi-proof-prepush
        name: Kibi Semantic Proof Gate
        entry: sh scripts/proof-prepush.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
